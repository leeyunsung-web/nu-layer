<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NU-LAYER / GALLERY</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#fff; --ink:#1d1d1f; --sub:#6e6e73;
    --border:#d2d2d7; --soft:#e8e8ed; --red:#c0392b;
    --mono:'SF Mono','Consolas','Menlo',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
          padding:12px 20px;background:rgba(245,245,247,.92);backdrop-filter:blur(10px);
          border-bottom:1px solid var(--soft);flex-wrap:wrap}
  .topbar h1{font-size:15px;letter-spacing:1.5px;font-weight:700}
  .build{font-size:9px;opacity:.45;letter-spacing:0;font-weight:400}
  .spacer{flex:1}
  .chip{font-family:var(--mono);font-size:11px;color:var(--sub);background:var(--panel);
        border:1px solid var(--border);border-radius:999px;padding:4px 10px}
  button.chip{cursor:pointer}
  button.chip:hover{border-color:var(--ink);color:var(--ink)}
  button.chip[disabled]{opacity:.4;cursor:default}
  button.danger{border-color:var(--red);color:var(--red)}
  button.danger:hover{background:var(--red);color:#fff}
  .note{font-family:var(--mono);font-size:11px;color:var(--sub);width:100%;min-height:1em}
  .note.bad{color:var(--red)}

  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;
        padding:20px;max-width:1600px;margin:0 auto}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}

  .card{position:relative;background:var(--panel);border:1px solid var(--soft);
        border-radius:14px;overflow:hidden;opacity:0;transform:translateY(6px);
        transition:opacity .45s ease,transform .45s ease}
  .card.shown{opacity:1;transform:none}
  .card.picked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .card img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;
            background:linear-gradient(45deg,#fafafa 25%,transparent 25%,transparent 75%,#fafafa 75%),
                       linear-gradient(45deg,#fafafa 25%,#fff 25%,#fff 75%,#fafafa 75%);
            background-size:18px 18px;background-position:0 0,9px 9px;cursor:pointer}
  .card .meta{display:flex;align-items:center;gap:6px;padding:7px 9px;
              border-top:1px solid var(--soft)}
  .card .name{font-family:var(--mono);font-size:10px;color:var(--sub);flex:1;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cap{padding:8px 10px 10px;border-top:1px solid var(--soft);font-size:11px;line-height:1.45;color:var(--sub)}
  .card .cap b{display:block;color:var(--ink);font-size:12px;font-weight:600;font-style:italic;margin-bottom:2px}
  .card .cap span{display:block}
  .acts{position:absolute;top:8px;right:8px;display:none;flex-direction:column;gap:6px}
  .card.show-actions .acts{display:flex}
  .acts button{font-family:var(--mono);font-size:10px;letter-spacing:.5px;
               border-radius:8px;padding:4px 8px;cursor:pointer;background:#fff;
               border:1px solid var(--border);color:var(--ink);
               box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .acts button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .acts button.del{border-color:var(--red);color:var(--red)}
  .acts button.del:hover{background:var(--red);color:#fff}

  /* ---- 제목 만들기 (마스터 전용) ---- */
  .card .meta .ttlbtn{font-family:var(--mono);font-size:10px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:2px 7px;cursor:pointer;color:var(--ink)}
  .card .meta .ttlbtn:hover{background:var(--ink);color:#fff}
  .tm-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .tm{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
  .tm header{padding:14px 18px;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:10px}
  .tm header b{font-size:13px;letter-spacing:.5px}
  .tm .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--sub)}
  .tm .prev{padding:14px 18px;font-size:16px;font-style:italic;font-weight:600;border-bottom:1px solid var(--soft);line-height:1.4}
  .tm .prev small{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--sub);margin-top:3px}
  .tm .tbuild{padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-bottom:1px solid var(--soft)}
  .tm .fixed{font-family:var(--mono);font-size:12px;color:var(--sub)}
  .tm .wchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ink);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
  .tm .wchip i{font-style:normal;font-size:10px;color:var(--sub)}
  .tm .wchip button{border:0;background:none;cursor:pointer;color:var(--sub);font-size:13px;padding:0 4px}
  .tm select.join{font-size:11px;border:1px dashed var(--border);border-radius:6px;padding:2px;background:#fff;color:var(--sub)}
  .tm .plus{border:1px dashed var(--ink);background:#fff;border-radius:999px;width:30px;height:28px;font-size:17px;cursor:pointer}
  .tm .plus.on{background:var(--ink);color:#fff}
  .tm .datebox{margin-left:auto;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px}
  .tm .datebox input{font-family:var(--mono);font-size:12px;width:90px;padding:3px 5px;border:1px solid var(--border);border-radius:6px}
  .tm .picker{display:flex;min-height:0;flex:1}
  .tm .cats{border-right:1px solid var(--soft);padding:8px;display:flex;flex-direction:column;gap:3px;min-width:120px}
  .tm .cats button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--sub)}
  .tm .cats button.on{background:var(--ink);color:#fff}
  .tm .words{overflow:auto;padding:8px 10px;flex:1;max-height:42vh;scroll-snap-type:y proximity}
  .tm .words button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid #f2f2f2;background:none;padding:8px 6px;cursor:pointer;font-size:14px;scroll-snap-align:start;text-align:left}
  .tm .words button:hover{background:#f6f6f6}
  .tm .words button span{color:var(--sub);font-size:12px}
  .tm .words .own{display:flex;gap:6px;padding:8px 6px}
  .tm .words .own input{flex:1;font-size:13px;padding:5px 7px;border:1px solid var(--border);border-radius:6px}
  .tm .chk{padding:10px 18px;border-bottom:1px solid var(--soft);font-size:12px;line-height:1.55;background:#fbfbfb}
  .tm .chk h4{margin:0 0 4px;font-size:11px;letter-spacing:.5px;color:var(--sub);font-weight:600}
  .tm .chk div{display:flex;gap:6px}
  .tm .chk .ok{color:#1f7a3a}.tm .chk .warn{color:#b26a00}.tm .chk .bad{color:var(--red)}
  .tm .chk .read{color:var(--sub);margin-top:4px}
  .tm footer{padding:12px 18px;border-top:1px solid var(--soft);display:flex;gap:8px;align-items:center}
  .tm footer .msg{font-size:11px;color:var(--sub);flex:1}
  .tm footer button{font-family:var(--mono);font-size:11px;border:1px solid var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;background:#fff}
  .tm footer button.go{background:var(--ink);color:#fff}

  .empty{grid-column:1/-1;text-align:center;color:var(--sub);font-family:var(--mono);
         font-size:12px;line-height:2;padding:70px 20px}
  .empty b{color:var(--ink)}
</style>
</head>
<body>

<div class="topbar">
  <h1>NU-LAYER / GALLERY <span class="build" id="build">g4</span></h1>
  <button class="chip" id="srcChip" title="Change the repository this gallery reads">—</button>
  <span class="spacer"></span>
  <span class="chip" id="count">—</span>
  <button class="chip" id="reload" title="Read the listing again">⟳ RELOAD</button>
  <button class="chip danger" id="delSel" hidden disabled>✕ DELETE SELECTED</button>
  <div class="note" id="note"></div>
</div>

<div class="grid" id="grid"><div class="empty">LOADING…</div></div>

<script>
(function(){
  'use strict';
  const BUILD = 'g8';
  const FOLDER = 'compositions';
  const GH_KEY = 'objet_studio_gh_config';   // 스튜디오와 같은 칸을 쓴다
  const ROLE_KEY = 'nulayer_role';
  const VER_KEY = 'nulayer_archive_ver';
  const OWN_KEY = 'nulayer_gallery_src';     // 이 페이지에서 직접 지정한 저장소

  const $ = id => document.getElementById(id);
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  };
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ---- 어느 저장소를 읽을 것인가 -----------------------------------------
  // 세 곳을 순서대로 본다. 스튜디오를 한 번도 안 열었거나 파일을 로컬에서
  // 열어도 무언가는 보여야 한다 -- 여기서 막히면 페이지가 통째로 죽는다.
  function fromPages(){
    const h = location.hostname || '';
    if(!/\.github\.io$/i.test(h)) return null;
    const owner = h.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean);
    return { owner, repo: seg.length ? seg[0] : owner + '.github.io', branch: 'main' };
  }
  function readCfg(){
    let stored = null, mine = null;
    try { stored = JSON.parse(ls.get(GH_KEY) || 'null'); } catch(e){}
    try { mine = JSON.parse(ls.get(OWN_KEY) || 'null'); } catch(e){}
    const base = (mine && mine.owner && mine.repo) ? mine
               : (stored && stored.owner && stored.repo) ? stored
               : fromPages();
    if(!base) return null;
    return { owner: base.owner, repo: base.repo, branch: base.branch || 'main',
             // 토큰은 스튜디오 설정에서만 온다. 이 페이지는 토큰을 저장하지 않는다.
             token: (stored && stored.token) || null };
  }
  let cfg = readCfg();
  const isMaster = () => !!(cfg && cfg.token) && ls.get(ROLE_KEY) === 'master';

  function headers(){
    const h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
    if(cfg && cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
    return h;
  }
  function bust(url){
    const v = ls.get(VER_KEY) || '';
    return v ? url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(v) : url;
  }

  // ---- 목록 --------------------------------------------------------------
  const isImg = p => /\.(png|jpe?g|webp)$/i.test(p);
  // 파일명에 ISO 시각이 들어 있으므로 이름으로 정렬해야 폴더를 넘나들어도
  // 최신순이 된다. 경로로 정렬하면 옛 평면 파일이 날짜 폴더보다 앞에 온다.
  const newest = (a,b) => b.name.localeCompare(a.name) || b.path.localeCompare(a.path);
  const raw = path => 'https://raw.githubusercontent.com/' + cfg.owner + '/' + cfg.repo
                    + '/' + cfg.branch + '/' + path.split('/').map(encodeURIComponent).join('/');
  const mk = (path, sha) => ({ path, sha, name: path.split('/').pop(), url: raw(path) });

  async function api(url){
    const res = await fetch(url, { headers: headers(), cache:'no-store' });
    if(!res.ok){
      let msg = res.statusText;
      try { const j = await res.json(); if(j && j.message) msg = j.message; } catch(e){}
      const err = new Error(res.status + ' ' + msg);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  // 트리 한 번이면 날짜 폴더가 몇 개든 요청이 하나다. 막히면 옛 방식으로 물러난다.
  async function listAll(){
    const tried = [];
    try {
      const t = await api('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo
        + '/git/trees/' + encodeURIComponent(cfg.branch) + '?recursive=1&t=' + Date.now());
      // 폴더에 ".hidden" 이 있으면 그 폴더(와 그 안)는 아카이브에 안 뜬다 (매니저의 눈 단추)
      const hidden = (t.tree || []).filter(x => x.type === 'blob' && /(^|\/)\.hidden$/.test(x.path))
                                   .map(x => x.path.replace(/\/?\.hidden$/, '') + '/');
      const isHid = p => hidden.some(h => p.indexOf(h) === 0);
      const out = (t.tree || [])
        .filter(x => x.type === 'blob' && x.path.indexOf(FOLDER + '/') === 0 && isImg(x.path) && !isHid(x.path))
        .map(x => mk(x.path, x.sha));
      return { files: out.sort(newest), how: 'git tree',
               warn: t.truncated ? 'the tree was truncated — some works may be missing' : '' };
    } catch(e){ tried.push('tree: ' + e.message); }

    try {
      const dir = async d => {
        try {
          const j = await api('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo
            + '/contents/' + encodeURI(d) + '?ref=' + encodeURIComponent(cfg.branch)
            + '&t=' + Date.now());
          return Array.isArray(j) ? j : [];
        } catch(e){ if(e.status === 404) return []; throw e; }
      };
      const out = [];
      for(const it of await dir(FOLDER)){
        if(it.type === 'file' && isImg(it.name)) out.push(mk(it.path, it.sha));
        else if(it.type === 'dir'){
          const inner = await dir(it.path);
          if(inner.some(f => f.type === 'file' && f.name === '.hidden')) continue;   // 숨긴 폴더
          for(const f of inner)
            if(f.type === 'file' && isImg(f.name)) out.push(mk(f.path, f.sha));
        }
      }
      return { files: out.sort(newest), how: 'contents API', warn: '' };
    } catch(e){ tried.push('contents: ' + e.message); }

    throw new Error(tried.join(' · '));
  }

  // ---- 화면 --------------------------------------------------------------
  let files = [], how = '';
  const picked = new Set();

  function say(msg, bad){
    $('note').className = 'note' + (bad ? ' bad' : '');
    $('note').textContent = msg || '';
  }
  function syncCount(){
    $('count').textContent = files.length + ' WORK' + (files.length === 1 ? '' : 'S');
    $('delSel').hidden = !isMaster();
    $('delSel').disabled = picked.size === 0;
    $('delSel').textContent = picked.size ? '✕ DELETE ' + picked.size + ' SELECTED'
                                          : '✕ DELETE SELECTED';
  }
  function syncSrcChip(){
    $('srcChip').textContent = cfg
      ? cfg.owner + '/' + cfg.repo + '@' + cfg.branch : 'SET REPOSITORY';
  }
  const showEmpty = html => { $('grid').innerHTML = '<div class="empty">' + html + '</div>'; };

  async function download(f){
    try {
      const res = await fetch(bust(f.url), { cache:'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = url; a.download = f.name; a.click();
      setTimeout(()=> URL.revokeObjectURL(url), 3000);
    } catch(e){ say('Download failed: ' + (e.message || e), true); }
  }

  async function removeOne(f){
    // 경로로 지운다. 날짜 폴더가 생기면서 이름만으로는 파일을 찾을 수 없다.
    const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo
              + '/contents/' + encodeURI(f.path);
    let sha = f.sha;
    if(!sha) sha = (await api(url + '?ref=' + encodeURIComponent(cfg.branch))).sha;
    const res = await fetch(url, {
      method:'DELETE',
      headers: Object.assign(headers(), { 'Content-Type':'application/json' }),
      body: JSON.stringify({ message:'Delete ' + f.path, sha, branch: cfg.branch }),
    });
    if(!res.ok){
      let m = res.statusText;
      try { const j = await res.json(); if(j && j.message) m = j.message; } catch(e){}
      throw new Error(res.status + ' ' + m);
    }
  }

  function hideActions(){
    const list = document.querySelectorAll('.card.show-actions');
    for(let i=0;i<list.length;i++) list[i].classList.remove('show-actions');
  }
  document.addEventListener('pointerdown', e => {
    if(!(e.target.closest && e.target.closest('.acts'))) hideActions();
  });

  function card(f, i){
    const el = document.createElement('div');
    el.className = 'card';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = f.name;
    img.src = bust(f.url);
    img.addEventListener('error', ()=>{ img.style.opacity = .25; });
    el.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'meta';
    if(isMaster()){
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', ()=>{
        if(cb.checked) picked.add(f.path); else picked.delete(f.path);
        el.classList.toggle('picked', cb.checked);
        syncCount();
      });
      meta.appendChild(cb);
      // 그림을 눌러도 골라지게 -- 작은 체크칸만 노리는 것은 성가시다.
      img.addEventListener('click', ()=>{
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      });
    }
    const nm = document.createElement('span');
    nm.className = 'name';
    const dir = f.path.split('/').slice(1, -1).join('/');
    const cp = caps[f.path];
    nm.textContent = cp ? (cp.date || '') : (dir ? dir + ' · ' + f.name : f.name);
    nm.title = f.path;
    meta.appendChild(nm);
    if(isMaster()){
      const tb = document.createElement('button'); tb.className = 'ttlbtn'; tb.textContent = '✎ TITLE'; tb.title = '제목 만들기';
      tb.addEventListener('click', e => { e.stopPropagation(); titleMaker(f); });
      meta.appendChild(tb);
    }
    el.appendChild(meta);
    if(cp){
      img.alt = cp.title || f.name;
      const c = document.createElement('div');
      c.className = 'cap';
      const t = document.createElement('b'); t.textContent = cp.title || ''; c.appendChild(t);
      for(const line of (cp.lines || [])){ const sp = document.createElement('span'); sp.textContent = line; c.appendChild(sp); }
      el.appendChild(c);
    }

    const acts = document.createElement('div');
    acts.className = 'acts';
    const dl = document.createElement('button');
    dl.textContent = '⬇ DOWNLOAD';
    dl.addEventListener('click', ()=>{ download(f); hideActions(); });
    acts.appendChild(dl);
    if(isMaster()){
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕ DELETE';
      del.addEventListener('click', async ()=>{
        hideActions();
        if(!confirm(f.path + '\nDelete this work? It cannot be undone.')) return;
        try {
          await removeOne(f);
          files = files.filter(x => x.path !== f.path);
          picked.delete(f.path);
          el.remove();
          syncCount();
          say('Deleted ' + f.path + '. It remains in the git history.');
        } catch(e){ say('Delete failed: ' + (e.message || e), true); }
      });
      acts.appendChild(del);
    }
    el.appendChild(acts);

    el.addEventListener('contextmenu', e => {
      e.preventDefault(); hideActions(); el.classList.add('show-actions');
    });
    setTimeout(()=> el.classList.add('shown'), 30 * (i % 15));
    return el;
  }

  $('delSel').addEventListener('click', async ()=>{
    const list = [];
    for(const p of picked) list.push(p);
    if(!list.length) return;
    if(!confirm(list.length + ' work(s) will be deleted from the repository.\n'
              + 'This cannot be undone. Continue?')) return;
    $('delSel').disabled = true;
    let done = 0; const bad = [];
    for(const p of list){
      const f = files.filter(x => x.path === p)[0];
      if(!f) continue;
      try { await removeOne(f); done++; }
      catch(e){ bad.push(f.name + ': ' + (e.message || e)); }
      say('Deleting ' + (done + bad.length) + '/' + list.length + '…');
    }
    say(done + ' deleted' + (bad.length ? ' · ' + bad.length + ' FAILED — ' + bad[0] : '')
        + '. They remain in the git history.', bad.length > 0);
    picked.clear();
    await load();
  });

  // 저장소를 직접 지정한다. 스튜디오를 한 번도 안 열었어도 볼 수 있어야 한다.
  $('srcChip').addEventListener('click', ()=>{
    const cur = cfg || { owner:'', repo:'', branch:'main' };
    const owner = prompt('GitHub owner (user or org)', cur.owner || '');
    if(owner === null) return;
    const repo = prompt('Repository name', cur.repo || '');
    if(repo === null) return;
    const branch = prompt('Branch', cur.branch || 'main');
    if(branch === null) return;
    ls.set(OWN_KEY, JSON.stringify({ owner: owner.trim(), repo: repo.trim(),
                                     branch: (branch || 'main').trim() }));
    cfg = readCfg();
    load();
  });
  $('reload').addEventListener('click', ()=> load());

  // ---- 캡션: compositions/captions.json  { "경로": {title, date, lines:[…]} } ----
  let caps = {};
  async function loadCaps(){
    caps = {};
    try {
      const res = await fetch(raw(FOLDER + '/captions.json') + '?t=' + Date.now(), { cache:'no-store' });
      if(res.ok){ const j = await res.json(); if(j && typeof j === 'object') caps = j; }
    } catch(e){}
  }
  // 캡션의 작품 날짜가 있으면 그 날짜로, 없으면 파일 이름 속 날짜로 최신순
  const when = f => (caps[f.path] && caps[f.path].date) || ((f.name.match(/\d{4}-\d{2}-\d{2}(T[\d-]+)?/) || [''])[0]);
  const ttl = f => (caps[f.path] && caps[f.path].title) || f.name;
  const byDate = (a,b) => when(b).localeCompare(when(a)) || ttl(b).localeCompare(ttl(a));

  async function load(){
    picked.clear();
    syncSrcChip();
    if(!cfg){
      files = []; syncCount(); say('');
      showEmpty('NO REPOSITORY SET.<br>Open the studio and connect GitHub, '
              + 'or <b>click the chip at the top</b> to enter it here.');
      return;
    }
    $('grid').innerHTML = '<div class="empty">LOADING…</div>';
    say('');
    try {
      const [r] = await Promise.all([listAll(), loadCaps()]);
      files = r.files.sort(byDate); how = r.how;
      syncCount();
      if(r.warn) say(r.warn, true);
      if(!files.length){
        showEmpty('NO WORKS UNDER <b>' + esc(FOLDER) + '/</b> IN '
                + esc(cfg.owner + '/' + cfg.repo + '@' + cfg.branch) + '.<br>'
                + 'Save one from 03 COMPOSITION in the studio, or press ⚄ BATCH.<br>'
                + '<span style="opacity:.6">read via ' + esc(how) + '</span>');
        return;
      }
      const grid = $('grid');
      grid.innerHTML = '';
      for(let i=0;i<files.length;i++) grid.appendChild(card(files[i], i));
      say(files.length + ' work(s) · read via ' + how
          + (isMaster() ? ' · master' : ' · read-only'));
    } catch(e){
      files = []; syncCount(); say('');
      // 무엇을 어디서 찾다 실패했는지 적는다. "안 열린다"만 남으면 고칠 수가 없다.
      showEmpty('COULD NOT READ <b>' + esc(FOLDER) + '/</b> IN '
        + esc(cfg.owner + '/' + cfg.repo + '@' + cfg.branch) + '.<br>'
        + esc(e.message || e) + '<br><br>'
        + 'If the repository is private, open the studio and connect GitHub first.<br>'
        + 'If it is public, check the owner, repository and branch names — '
        + '<b>click the chip at the top</b> to change them.');
    }
  }


  // ---- 제목 만들기: 시리즈 이름 + 고른 단어들 + 날짜 (마스터만, 한국어 뜻은 이 창에서만 보임) ----
  const SERIES = 'NU-LAYER Study';
  const WORDS = [
    ['대상', [['Medusa','메두사'],['Torso','토르소'],['Venus','비너스'],['Laocoön','라오콘'],['Angel','천사'],['Figure','인물'],['Face','얼굴'],['Head','머리'],['Bust','흉상'],['Eye','눈'],['Eyes','두 눈'],['Mouth','입'],['Lips','입술'],['Hair','머리카락'],['Hand','손'],['Heart','하트'],['Serpents','뱀들'],['Body','몸']]],
    ['폭발·형태', [['Burst','폭발'],['Explosion','대폭발'],['Starburst','별 모양 폭발'],['Shards','파편'],['Shard','파편 (하나)'],['Burst of Stars','별 폭발'],['Crackle','파지직 (전기 튀는 소리·느낌)'],['Fragments','조각들'],['Debris','잔해'],['Stars','별'],['Spikes','가시'],['Sparks','불꽃'],['Flash','섬광'],['Rays','빛줄기'],['Shockwave','충격파'],['Storm','폭풍'],['Smoke','연기'],['Cloud','구름'],['Bubbles','거품'],['Drops','방울'],['Splash','물보라'],['Wave','물결'],['Ribbon','띠'],['Lines','선들'],['Swirl','소용돌이']]],
    ['느낌·선', [['Dense','빽빽한'],['Electric','전기의, 찌릿한'],['Sparse','성긴'],['Dark','어두운'],['Light','밝은'],['Bold Line','굵은 선'],['Fine Line','가는 선'],['Screentone','망점'],['Hatching','빗금'],['Engraved','판화식 선'],['Scribble','낙서 같은 선'],['Sharp','날카로운'],['Soft','부드러운'],['Quiet','고요한'],['Violent','격렬한'],['Shattered','부서진'],['Broken','깨진']]],
    ['구도', [['Wide','가로로 넓은'],['Tall','세로로 긴'],['Close-up','가까이 본'],['Floating','떠 있는'],['Falling','떨어지는'],['Rising','솟아오르는'],['Turning','돌아보는'],['Cut','칸 (잘린 장면)'],['Manga Panel','만화 칸'],['Manga Panels','만화 칸들'],['Manga Cut','만화 칸 (영어권에선 낯선 말)'],['Panel','칸'],['Fragment','단편'],['Ruins','폐허'],['Center','가운데'],['Edge','가장자리']]],
    ['번호', [['I','1'],['II','2'],['III','3'],['IV','4'],['V','5'],['VI','6'],['VII','7']]],
  ];
  // 단어 사이 잇는 방법: 한 덩어리 이름 / 여러 개 나열 / 이어 주는 말
  const JOINS = [[' ','붙여서 한 이름 (Medusa Burst)'],[', ','쉼표로 나열 (Medusa, Burst)'],[' and ','and — 그리고'],[' in the ','in the — ~ 속의'],[' in a ','in a — (어떤) ~ 속의'],[' in ','in — ~ 속의'],[' among ','among — ~ 사이의'],[' with ','with — ~와 함께'],[' of ','of — ~의'],[' / ','/ — 나란히']];
  const ko = w => { for(const [,L] of WORDS) for(const [e,k] of L) if(e === w) return k; return ''; };
  const ymd = d => String(d || '').replace(/-/g,'');
  function buildTitle(words, date){
    const phrase = (words || []).map((x,i) => (i ? (x.join == null ? ' ' : x.join) : '') + x.w).join('');
    const d = ymd(date);
    return phrase ? SERIES + ': ' + phrase + (d ? ', ' + d : '') : SERIES + (d ? ' ' + d : '');
  }


  // ---- 제목 검증: 말이 되는지(문법) · 작품 제목으로 괜찮은지 (규칙으로 점검) ----
  // 품사: N 명사, A 꾸미는 말(형용사), R 번호
  const POS = {Electric:'A',Dense:'A',Sparse:'A',Dark:'A',Light:'A',Engraved:'A',Sharp:'A',Soft:'A',Quiet:'A',Violent:'A',Shattered:'A',Broken:'A',
    Wide:'A',Tall:'A',Floating:'A',Falling:'A',Rising:'A',Turning:'A',I:'R',II:'R',III:'R',IV:'R',V:'R',VI:'R',VII:'R'};
  const pos = w => POS[w] || (ko(w) ? 'N' : '?');
  const PLURAL = {Eyes:1,Serpents:1,Shards:1,Fragments:1,Stars:1,Spikes:1,Sparks:1,Rays:1,Bubbles:1,Drops:1,Lines:1,Ruins:1,Debris:1};
  function checkTitle(words){
    const out = []; const add = (lv, t) => out.push([lv, t]);
    if(!words.length){ add('warn','단어가 없으면 "NU-LAYER Study 날짜"만 남아요. 제목으로는 되지만 작품끼리 구별이 어려워요.'); return out; }
    const J = i => i ? (words[i].join == null ? ' ' : words[i].join) : '';
    const seen = {};
    words.forEach((x, i) => {
      const p = pos(x.w), j = J(i), next = words[i+1], np = next ? pos(next.w) : null, nj = next ? J(i+1) : null;
      if(seen[x.w.toLowerCase()]) add('bad', '"' + x.w + '"가 두 번 들어갔어요. 하나는 빼세요.');
      seen[x.w.toLowerCase()] = 1;
      if(x.w.toLowerCase() === 'study') add('warn', '시리즈 이름에 이미 Study가 있어서 겹쳐요.');
      // 꾸미는 말은 명사 앞에 붙거나, 쉼표 뒤에서 따로 설명하는 자리에 있어야 한다
      if(p === 'A'){
        const before = i > 0 && j === ' ' && pos(words[i-1].w) === 'N';
        if(before) add('bad', '"' + words[i-1].w + ' ' + x.w + '"는 영어 순서가 어색해요. 꾸미는 말은 앞에: "' + x.w + ' ' + words[i-1].w + '", 또는 쉼표로 따로: "' + words[i-1].w + ', ' + x.w + '"');
        if(j && j !== ' ' && j !== ', ' && !(next && nj === ' ' && np === 'N')) add('bad', '"' + j.trim() + '" 뒤에는 명사(대상·형태)가 와야 해요. "' + x.w + '" 뒤에 명사를 붙이거나 잇는 방법을 쉼표로 바꾸세요.');
        if(!next && i > 0 && j === ' ') {}
      }
      if(p === 'R'){
        if(next) add('warn', '번호(' + x.w + ')는 보통 맨 끝에 둬요.');
        if(i === 0) add('bad', '번호만으로 시작하면 제목이 안 돼요. 앞에 단어를 넣으세요.');
        if(j && j !== ' ') add('warn', '번호 앞은 "붙여서"로 잇는 게 자연스러워요: "Medusa Burst II"');
      }
      if((j === ' in the ' || j === ' in a ' || j === ' in ' || j === ' among ') && p === 'A') add('bad', '"in the" 뒤에는 명사가 와야 해요.');
      if((j === ' and ' || j === ' with ') && p === 'R') add('bad', '"' + j.trim() + '" 뒤에 번호가 오면 말이 안 돼요.');
    });
    // 꾸미는 말만 있고 명사가 없음
    if(!words.some(x => pos(x.w) === 'N' || pos(x.w) === '?')) add('bad', '꾸미는 말만 있고 무엇인지(명사)가 없어요. 대상이나 형태 단어를 하나 넣으세요.');
    // 명사 + 명사 붙임: 앞 명사가 뒤 명사를 꾸미는 영어식 (Medusa Burst = 메두사의 폭발) — 복수형이 앞에 오면 어색
    words.forEach((x, i) => { if(i && J(i) === ' ' && pos(words[i-1].w) === 'N' && pos(x.w) === 'N' && PLURAL[words[i-1].w] && !/s$/.test(x.w))
      add('warn', '"' + words[i-1].w + ' ' + x.w + '"는 앞 단어를 단수로 쓰는 게 자연스러워요 (예: Star ' + x.w + ').'); });
    // 명사가 세 개 이상 쉼표 없이 줄줄이 붙으면 무엇이 중심인지 흐려진다
    { let run = 0, start = 0;
      words.forEach((x, i) => { const p = pos(x.w); if(p === 'N' && (i === 0 || J(i) === ' ')){ if(!run) start = i; run++; } else run = (p === 'N') ? (start = i, 1) : 0;
        if(run === 3) add('warn', '"' + words.slice(start, i + 1).map(y => y.w).join(' ') + '"처럼 명사가 셋 이상 붙어 있으면 무엇이 중심인지 흐려요. 쉼표나 of · in the 로 나누어 보세요 (예: "' + words[i].w + ' of the ' + words[start].w + '" / "' + words[start].w + ', ' + words.slice(start+1, i+1).map(y => y.w).join(' ') + '").'); }); }
    // 작품 제목으로서
    const n = words.length;
    if(n > 5) add('warn', '단어가 ' + n + '개예요. 작품 제목은 보통 1~4단어가 기억하기 좋아요.');
    const commas = words.filter((x, i) => J(i) === ', ').length;
    if(commas >= 3) add('warn', '쉼표로 너무 많이 나열하면 제목보다 설명문처럼 보여요. 핵심 두세 단어만 남겨 보세요.');
    const tech = words.filter(x => /^(Screentone|Hatching|Engraved|Bold Line|Fine Line|Scribble)$/.test(x.w));
    if(tech.length && tech.length === n) add('warn', '기법 단어만 있으면 재료 설명처럼 보여요. 대상이나 형태 단어를 함께 넣으면 작품 제목다워져요.');
    if(!out.some(x => x[0] !== 'ok')) add('ok', '영어 순서와 잇는 말이 자연스러워요. 작품 제목으로 써도 괜찮아요.');
    else if(!out.some(x => x[0] === 'bad')) out.unshift(['ok', '말은 돼요. 아래는 더 다듬을 수 있는 점이에요.']);
    if(words.some(x => pos(x.w) === '?')) add('warn', '직접 쓴 단어(' + words.filter(x => pos(x.w) === '?').map(x => x.w).join(', ') + ')는 철자와 뜻을 따로 확인해 주세요.');
    return out;
  }
  // 한국어로 어떻게 읽히는지 (확인용)
  function readKo(words){
    // 영어 연결어는 한국어 어순으로 뒤집어 읽는다: A in the B → B 속의 A, A of B → B의 A
    let acc = '', seg = '';
    const flush = () => { const t = seg; seg = ''; return t; };
    let pend = null;
    words.forEach((x, i) => {
      const k = ko(x.w) || x.w, j = i ? (x.join == null ? ' ' : x.join) : '';
      if(i === 0 || j === ' '){ seg += (seg ? ' ' : '') + k; return; }
      const left = (acc ? acc : '') + (pend ? '' : ''), cur = flush();
      acc = pend ? pend(acc, cur) : (acc ? acc + ' ' : '') + cur;
      pend = (j === ' in the ' || j === ' in a ' || j === ' in ') ? (a, b) => b + ' 속의 ' + a : j === ' among ' ? (a, b) => b + ' 사이의 ' + a : j === ' of ' ? (a, b) => b + '의 ' + a : j === ' with ' ? (a, b) => b + '와 함께 있는 ' + a
           : j === ' and ' ? (a, b) => a + ' 그리고 ' + b : j === ', ' ? (a, b) => a + ', ' + b : (a, b) => a + ' / ' + b;
      seg = k;
    });
    const last = flush();
    return pend ? pend(acc, last) : (acc ? acc + ' ' : '') + last;
  }


  async function saveCaps(){
    const path = FOLDER + '/captions.json';
    const url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encodeURI(path);
    let sha;
    try { sha = (await api(url + '?ref=' + encodeURIComponent(cfg.branch) + '&t=' + Date.now())).sha; } catch(e){ if(e.status !== 404) throw e; }
    const text = JSON.stringify(caps, null, 1);
    let bin = ''; for(const b of new TextEncoder().encode(text)) bin += String.fromCharCode(b);
    const b64 = btoa(bin);
    const res = await fetch(url, { method:'PUT', headers: Object.assign(headers(), { 'Content-Type':'application/json' }),
      body: JSON.stringify({ message:'Gallery titles', content: b64, sha, branch: cfg.branch }) });
    if(!res.ok){ let m = res.statusText; try { const j = await res.json(); if(j && j.message) m = j.message; } catch(e){} throw new Error(res.status + ' ' + m); }
  }

  function titleMaker(f){
    const cp = caps[f.path] || (caps[f.path] = { title: '', date: '', lines: [] });
    let words = JSON.parse(JSON.stringify(cp.words || []));
    let date = cp.date || '';
    let cat = 0, picking = words.length === 0;
    const back = document.createElement('div'); back.className = 'tm-back';
    const box = document.createElement('div'); box.className = 'tm'; back.appendChild(box);
    const close = () => back.remove();
    back.addEventListener('pointerdown', e => { if(e.target === back) close(); });
    function draw(){
      box.innerHTML = '';
      const hd = document.createElement('header');
      hd.innerHTML = '<b>TITLE · 제목 만들기</b>';
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.onclick = close; hd.appendChild(x);
      box.appendChild(hd);
      const pv = document.createElement('div'); pv.className = 'prev';
      pv.textContent = buildTitle(words, date);
      const sm = document.createElement('small'); sm.textContent = words.length ? words.map(w => w.w + (ko(w.w) ? ' (' + ko(w.w) + ')' : '')).join(' · ') : '아래 + 를 눌러 단어를 고르세요';
      pv.appendChild(sm); box.appendChild(pv);
      const ck = document.createElement('div'); ck.className = 'chk';
      ck.innerHTML = '<h4>검증 · 말이 되는지 / 작품 제목으로 괜찮은지</h4>';
      for(const [lv, t] of checkTitle(words)){
        const d = document.createElement('div'); d.className = lv;
        d.textContent = (lv === 'ok' ? '✓ ' : lv === 'warn' ? '△ ' : '✕ ') + t; ck.appendChild(d);
      }
      if(words.length){ const r = document.createElement('div'); r.className = 'read'; r.textContent = '읽히는 뜻: ' + readKo(words); ck.appendChild(r); }
      box.appendChild(ck);
      const bd = document.createElement('div'); bd.className = 'tbuild';
      const fx = document.createElement('span'); fx.className = 'fixed'; fx.textContent = SERIES + ':'; bd.appendChild(fx);
      words.forEach((w, i) => {
        if(i){
          const sel = document.createElement('select'); sel.className = 'join'; sel.title = '앞 단어와 잇는 방법';
          for(const [v, t] of JOINS){ const o = document.createElement('option'); o.value = v; o.textContent = t; if((w.join == null ? ' ' : w.join) === v) o.selected = true; sel.appendChild(o); }
          sel.onchange = () => { w.join = sel.value; draw(); };
          bd.appendChild(sel);
        }
        const ch = document.createElement('span'); ch.className = 'wchip';
        ch.innerHTML = esc(w.w) + (ko(w.w) ? ' <i>' + esc(ko(w.w)) + '</i>' : '');
        const rm = document.createElement('button'); rm.textContent = '×'; rm.title = '빼기';
        rm.onclick = () => { words.splice(i, 1); draw(); };
        ch.appendChild(rm); bd.appendChild(ch);
      });
      const pl = document.createElement('button'); pl.className = 'plus' + (picking ? ' on' : ''); pl.textContent = '+'; pl.title = '단어 더하기';
      pl.onclick = () => { picking = !picking; draw(); };
      bd.appendChild(pl);
      const db = document.createElement('label'); db.className = 'datebox'; db.textContent = '날짜';
      const di = document.createElement('input'); di.value = ymd(date); di.placeholder = 'YYYYMMDD';
      di.oninput = () => { const v = di.value.replace(/\D/g,''); if(v.length === 8){ date = v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6); pv.firstChild.textContent = buildTitle(words, date); } };
      db.appendChild(di); bd.appendChild(db);
      box.appendChild(bd);
      if(picking){
        const pk = document.createElement('div'); pk.className = 'picker';
        const cs = document.createElement('div'); cs.className = 'cats';
        WORDS.forEach(([name], i) => { const b = document.createElement('button'); b.textContent = name; if(i === cat) b.className = 'on'; b.onclick = () => { cat = i; draw(); }; cs.appendChild(b); });
        pk.appendChild(cs);
        const ws = document.createElement('div'); ws.className = 'words';
        for(const [e, k] of WORDS[cat][1]){
          const b = document.createElement('button'); b.innerHTML = esc(e) + ' <span>' + esc(k) + '</span>';
          b.onclick = () => { words.push({ w: e, join: words.length ? ' ' : null }); draw(); };
          ws.appendChild(b);
        }
        const own = document.createElement('div'); own.className = 'own';
        const oi = document.createElement('input'); oi.placeholder = '목록에 없는 단어 직접 쓰기 (영어)';
        const ob = document.createElement('button'); ob.textContent = '더하기';
        const addOwn = () => { const v = oi.value.trim(); if(v){ words.push({ w: v, join: words.length ? ' ' : null }); draw(); } };
        ob.onclick = addOwn; oi.onkeydown = e => { if(e.key === 'Enter') addOwn(); };
        own.appendChild(oi); own.appendChild(ob); ws.appendChild(own);
        pk.appendChild(ws); box.appendChild(pk);
      }
      const ft = document.createElement('footer');
      const msg = document.createElement('span'); msg.className = 'msg'; msg.textContent = '한국어 뜻은 이 창에서만 보이고, 갤러리에는 영어 제목만 나와요.';
      const cancel = document.createElement('button'); cancel.textContent = '취소'; cancel.onclick = close;
      const ok = document.createElement('button'); ok.className = 'go'; ok.textContent = '저장';
      ok.onclick = async () => {
        const prev = JSON.stringify(cp);
        cp.words = words; cp.date = date; cp.title = buildTitle(words, date);
        if(cp.lines && cp.lines[0] && date) cp.lines[0] = cp.lines[0].replace(/^\d{4}/, date.slice(0,4));
        ok.disabled = true; msg.textContent = '저장하는 중…';
        try { await saveCaps(); close(); files.sort(byDate); const grid = $('grid'); grid.innerHTML = ''; files.forEach((g, i) => grid.appendChild(card(g, i))); say('Saved title: ' + cp.title); }
        catch(e){ Object.assign(cp, JSON.parse(prev)); ok.disabled = false; msg.textContent = '저장 실패: ' + (e.message || e); }
      };
      ft.appendChild(msg); ft.appendChild(cancel); ft.appendChild(ok);
      box.appendChild(ft);
    }
    draw();
    document.body.appendChild(back);
  }

  // 다른 탭에서 마스터를 풀거나 설정을 바꾸면 여기도 따라간다.
  window.addEventListener('storage', ev => {
    if(ev.key === ROLE_KEY || ev.key === GH_KEY){ cfg = readCfg(); load(); }
  });

  $('build').textContent = BUILD;
  load();
})();
</script>
