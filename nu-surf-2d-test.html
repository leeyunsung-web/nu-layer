<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NU SURF 옆면 계산 시험</title>
<style>
:root{ --bg:#FBF8F7; --ink:#33123A; --soft:#7A5C80; --line:#9C2F86; --pink:#F9618D; --panel:#fff }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1C0E22; --ink:#FBEAF1; --soft:#C39FC6; --line:#E06BC6; --panel:#28152F } }
:root[data-theme="dark"]{ --bg:#1C0E22; --ink:#FBEAF1; --soft:#C39FC6; --line:#E06BC6; --panel:#28152F }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:20px;letter-spacing:.1em} p{margin:0;color:var(--soft);font-size:13px;line-height:1.5}
canvas{width:100%;height:auto;display:block;border:3px solid var(--line);border-radius:12px;background:#0b2fa8}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;min-height:38px;padding:6px 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--pink);color:#33123A}
label{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
input[type=range]{accent-color:var(--line)}
#stat{margin-left:auto;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>NU SURF · 옆면 계산 시험 (A안)</h1>
  <p>파도 옆면 한 장을 물 알갱이로 직접 계산합니다. 물이 위로 솟아 앞으로 던져지는 것까지 계산하므로, 그리지 않아도 혀가 생기는지 보는 시험입니다. 왼쪽 판이 물을 밀어 파도를 만들고, 오른쪽 비탈(백사장)에서 부서집니다.</p>
  <canvas id="cv" width="1280" height="300" aria-label="파도 옆면 계산"></canvas>
  <div class="bar">
    <button id="bPush" type="button">파도 하나 보내기</button>
    <button id="bAuto" type="button" aria-pressed="true">자동으로 계속</button>
    <button id="bPause" type="button" aria-pressed="false">멈춤</button>
    <button id="bReset" type="button">처음부터</button>
    <label>파도 크기 <input id="rH" type="range" min="0.15" max="0.6" step="0.01" value="0.5"><output id="oH">0.50</output></label>
    <label>비탈 기울기 <input id="rS" type="range" min="0.04" max="0.2" step="0.005" value="0.083"><output id="oS">0.083</output></label>
    <label>보기 <select id="vMode"><option value="water">물</option><option value="speed">빠르기</option></select></label>
    <span id="stat"></span>
  </div>
</div>
<script>
(()=>{
/* ── 2D 물 계산: FLIP (Zhu & Bridson 2005, Müller 'Ten Minute Physics' 방식) ──
   물 알갱이가 물을 싣고 다니고, 격자에서 '물은 눌리지 않는다'를 풀어 압력으로 밀어 준다.
   알갱이 방식이라 수면이 접히고 넘어가는(혀) 모양을 그대로 계산하고, 격자 방식이라 파도가 쉽게 닳지 않는다 */
const $=id=>document.getElementById(id);
const cv=$("cv"), g=cv.getContext("2d");
const P={ L:34, D:1.5, H:0.5, slope:1/12, xs:13, top:3.6, hc:0.07 };   /* 수조 길이·물 깊이·파도 크기(깊이 대비)·비탈·비탈 시작·수조 높이·격자 칸 */
const gconst=9.8;
let NX, NY, hg, inv, u, v, du, dv, pu, pv, pr, sol, ctype, pdens, rest=0, N=0, X, Y, VX, VY, cellCount, firstCell, sortedIdx, paddle=0, paddleV=0, t=0, pushT=3, auto=true, paused=false;
const FLUID=0, AIR=1, SOLID=2;
const bed=x=>x<P.xs?0:Math.min((x-P.xs)*P.slope, P.D*2.2);
let rP=0;
function init(){
  hg=P.hc; inv=1/hg; NX=Math.ceil(P.L/hg)+1; NY=Math.ceil(P.top/hg)+1; const n=NX*NY;
  u=new Float32Array(n); v=new Float32Array(n); du=new Float32Array(n); dv=new Float32Array(n); pu=new Float32Array(n); pv=new Float32Array(n); pr=new Float32Array(n); sol=new Float32Array(n); ctype=new Int32Array(n); pdens=new Float32Array(n);
  rP=0.3*hg; const dxp=2*rP, dyp=Math.sqrt(3)/2*dxp; const xs=[], ys=[];
  for(let row=0, y=rP+hg; y<P.D; row++, y+=dyp) for(let x=hg+rP+(row%2?rP:0); x<P.L-hg; x+=dxp){ if(y>bed(x)+rP+0.02) { xs.push(x); ys.push(y); } }
  N=xs.length; X=new Float32Array(xs); Y=new Float32Array(ys); VX=new Float32Array(N); VY=new Float32Array(N);
  paddle=0; paddleV=0; t=0; pushT=3; rest=0; setSolids();
  const pn=Math.ceil(P.L/(2.2*rP))+1, pm=Math.ceil(P.top/(2.2*rP))+1; cellCount=new Int32Array(pn*pm); firstCell=new Int32Array(pn*pm+1); sortedIdx=new Int32Array(N);
}
/* 단단한 칸: 테두리 · 비탈 아래 · 파도 판 뒤 */
function setSolids(){ for(let i=0;i<NX;i++) for(let j=0;j<NY;j++){ const x=(i+0.5)*hg, y=(j+0.5)*hg; let s=1; if(i===0||i===NX-1||j===0) s=0; if(y<bed(x)) s=0; if(x<paddle) s=0; sol[i*NY+j]=s; } }
function paddleAt(tt){ const Hh=P.H*P.D, k=Math.sqrt(3*Hh/(4*P.D**3)), c=Math.sqrt(gconst*(P.D+Hh)), S=Math.sqrt(16*Hh*P.D/3);   /* Goring 고립파 판: x = S/2·(1+tanh(k·c·(t−t0))) */
  const a=tt-pushT; let x=S*0.5*(1+Math.tanh(k*c*a)); const back=Math.max(0,a-6/(k*c)); x*=Math.exp(-back/12); return hg*1.0+x; }
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
function integrate(dt){ for(let i=0;i<N;i++){ VY[i]-=gconst*dt; X[i]+=VX[i]*dt; Y[i]+=VY[i]*dt; } }
function pushApart(iters){ const ps=2.2*rP, pin=1/ps, pn=Math.ceil(P.L/ps)+1, pm=Math.ceil(P.top/ps)+1, minD=2*rP, minD2=minD*minD;
  cellCount.fill(0); for(let i=0;i<N;i++){ const xi=clamp((X[i]*pin)|0,0,pn-1), yi=clamp((Y[i]*pin)|0,0,pm-1); cellCount[xi*pm+yi]++; }
  let f=0; for(let c=0;c<pn*pm;c++){ f+=cellCount[c]; firstCell[c]=f; } firstCell[pn*pm]=f;
  for(let i=0;i<N;i++){ const xi=clamp((X[i]*pin)|0,0,pn-1), yi=clamp((Y[i]*pin)|0,0,pm-1), c=xi*pm+yi; firstCell[c]--; sortedIdx[firstCell[c]]=i; }
  for(let it=0;it<iters;it++) for(let i=0;i<N;i++){ const px=X[i], py=Y[i], pxi=(px*pin)|0, pyi=(py*pin)|0, x0=Math.max(pxi-1,0), y0=Math.max(pyi-1,0), x1=Math.min(pxi+1,pn-1), y1=Math.min(pyi+1,pm-1);
    for(let xi=x0;xi<=x1;xi++) for(let yi=y0;yi<=y1;yi++){ const c=xi*pm+yi; for(let q=firstCell[c];q<firstCell[c+1];q++){ const id=sortedIdx[q]; if(id===i) continue; const dx=X[id]-px, dy=Y[id]-py, d2=dx*dx+dy*dy; if(d2>minD2||d2===0) continue; const d=Math.sqrt(d2), s=0.5*(minD-d)/d; X[i]-=dx*s; Y[i]-=dy*s; X[id]+=dx*s; Y[id]+=dy*s; } } } }
function collide(){ for(let i=0;i<N;i++){ let x=X[i], y=Y[i]; const r=rP;
    if(x<paddle+r){ x=paddle+r; VX[i]=Math.max(VX[i],paddleV); }
    if(x>P.L-hg-r){ x=P.L-hg-r; VX[i]=Math.min(0,VX[i]); }
    if(y<hg+r){ y=hg+r; VY[i]=Math.max(0,VY[i]); }
    if(y>P.top-hg-r){ y=P.top-hg-r; VY[i]=Math.min(0,VY[i]); }
    if(x>P.xs){ const by=bed(x), nx=-P.slope, ny=1, nl=Math.hypot(nx,ny), d=(y-by)/nl*1 - r; if(d<0){ x-=nx/nl*d; y-=ny/nl*d; const vn=(VX[i]*nx+VY[i]*ny)/nl; if(vn<0){ VX[i]-=vn*nx/nl; VY[i]-=vn*ny/nl; } } }
    X[i]=x; Y[i]=y; } }
function toGrid(){ const n=NX*NY; pu.set(u); pv.set(v); du.fill(0); dv.fill(0); u.fill(0); v.fill(0);
  for(let c=0;c<n;c++) ctype[c]=sol[c]===0?SOLID:AIR;
  for(let i=0;i<N;i++){ const xi=clamp((X[i]*inv)|0,0,NX-1), yi=clamp((Y[i]*inv)|0,0,NY-1), c=xi*NY+yi; if(ctype[c]===AIR) ctype[c]=FLUID; }
  for(let comp=0;comp<2;comp++){ const dx=comp===0?0:0.5*hg, dy=comp===0?0.5*hg:0, f=comp===0?u:v, d=comp===0?du:dv, V=comp===0?VX:VY;
    for(let i=0;i<N;i++){ const x=clamp(X[i],hg,(NX-1)*hg), y=clamp(Y[i],hg,(NY-1)*hg), x0=Math.min(((x-dx)*inv)|0,NX-2), tx=((x-dx)-x0*hg)*inv, x1=Math.min(x0+1,NX-2), y0=Math.min(((y-dy)*inv)|0,NY-2), ty=((y-dy)-y0*hg)*inv, y1=Math.min(y0+1,NY-2), sx=1-tx, sy=1-ty;
      const d0=sx*sy, d1=tx*sy, d2=tx*ty, d3=sx*ty, n0=x0*NY+y0, n1=x1*NY+y0, n2=x1*NY+y1, n3=x0*NY+y1, pv2=V[i];
      f[n0]+=pv2*d0; d[n0]+=d0; f[n1]+=pv2*d1; d[n1]+=d1; f[n2]+=pv2*d2; d[n2]+=d2; f[n3]+=pv2*d3; d[n3]+=d3; }
    for(let c=0;c<n;c++) if(d[c]>0) f[c]/=d[c];
    for(let i=0;i<NX;i++) for(let j=0;j<NY;j++){ const c=i*NY+j, solid=ctype[c]===SOLID;
      if(comp===0 && (solid || (i>0 && ctype[(i-1)*NY+j]===SOLID))) u[c]=(i*hg<=paddle+hg && (j+0.5)*hg>bed(i*hg))?paddleV:0;   /* 파도 판 면은 판 빠르기로 */
      if(comp===1 && (solid || (j>0 && ctype[i*NY+j-1]===SOLID))) v[c]=0; } } }
function density(){ pdens.fill(0); const h2=0.5*hg;
  for(let i=0;i<N;i++){ const x=clamp(X[i],hg,(NX-1)*hg), y=clamp(Y[i],hg,(NY-1)*hg), x0=((x-h2)*inv)|0, tx=((x-h2)-x0*hg)*inv, x1=Math.min(x0+1,NX-2), y0=((y-h2)*inv)|0, ty=((y-h2)-y0*hg)*inv, y1=Math.min(y0+1,NY-2), sx=1-tx, sy=1-ty;
    if(x0<NX&&y0<NY) pdens[x0*NY+y0]+=sx*sy; if(x1<NX&&y0<NY) pdens[x1*NY+y0]+=tx*sy; if(x1<NX&&y1<NY) pdens[x1*NY+y1]+=tx*ty; if(x0<NX&&y1<NY) pdens[x0*NY+y1]+=sx*ty; }
  if(rest===0){ let s=0, m=0; for(let c=0;c<NX*NY;c++) if(ctype[c]===FLUID){ s+=pdens[c]; m++; } if(m>0) rest=s/m; } }
function incompress(iters,dt){ pr.fill(0); pu.set(u); pv.set(v); const cp=1000*hg/dt, over=1.9;
  for(let it=0;it<iters;it++) for(let i=1;i<NX-1;i++) for(let j=1;j<NY-1;j++){ const c=i*NY+j; if(ctype[c]!==FLUID) continue;
    const l=(i-1)*NY+j, r=(i+1)*NY+j, b=i*NY+j-1, tp=i*NY+j+1, sx0=sol[l], sx1=sol[r], sy0=sol[b], sy1=sol[tp], s=sx0+sx1+sy0+sy1; if(s===0) continue;
    let div=u[r]-u[c]+v[tp]-v[c]; if(rest>0){ const comp=pdens[c]-rest; if(comp>0) div-=1.0*comp; }   /* 알갱이가 몰린 곳은 조금 더 밀어 퍼뜨린다 (물 부피 유지) */
    let pp=-div/s; pp*=over; pr[c]+=cp*pp; u[c]-=sx0*pp; u[r]+=sx1*pp; v[c]-=sy0*pp; v[tp]+=sy1*pp; } }
function toParticles(flip){ for(let comp=0;comp<2;comp++){ const dx=comp===0?0:0.5*hg, dy=comp===0?0.5*hg:0, f=comp===0?u:v, pf=comp===0?pu:pv, V=comp===0?VX:VY, off=comp===0?NY:1;
    for(let i=0;i<N;i++){ const x=clamp(X[i],hg,(NX-1)*hg), y=clamp(Y[i],hg,(NY-1)*hg), x0=Math.min(((x-dx)*inv)|0,NX-2), tx=((x-dx)-x0*hg)*inv, x1=Math.min(x0+1,NX-2), y0=Math.min(((y-dy)*inv)|0,NY-2), ty=((y-dy)-y0*hg)*inv, y1=Math.min(y0+1,NY-2), sx=1-tx, sy=1-ty;
      const d0=sx*sy, d1=tx*sy, d2=tx*ty, d3=sx*ty, n0=x0*NY+y0, n1=x1*NY+y0, n2=x1*NY+y1, n3=x0*NY+y1;
      const v0=(ctype[n0]!==AIR||ctype[n0-off]!==AIR)?1:0, v1=(ctype[n1]!==AIR||ctype[n1-off]!==AIR)?1:0, v2=(ctype[n2]!==AIR||ctype[n2-off]!==AIR)?1:0, v3=(ctype[n3]!==AIR||ctype[n3-off]!==AIR)?1:0, dd=v0*d0+v1*d1+v2*d2+v3*d3;
      if(dd>0){ const pic=(v0*d0*f[n0]+v1*d1*f[n1]+v2*d2*f[n2]+v3*d3*f[n3])/dd, corr=(v0*d0*(f[n0]-pf[n0])+v1*d1*(f[n1]-pf[n1])+v2*d2*(f[n2]-pf[n2])+v3*d3*(f[n3]-pf[n3]))/dd; V[i]=(1-flip)*pic+flip*(V[i]+corr); } } } }
function step(dt){
  t+=dt; if(auto && t-pushT>Math.max(16, P.L/Math.sqrt(gconst*P.D)*1.7)) pushT=t+3;
  const np=paddleAt(t); paddleV=(np-paddle)/dt; paddle=np; setSolids();
  integrate(dt); pushApart(2); collide(); toGrid(); density(); incompress(40,dt); toParticles(0.92);
}
/* 혀(오버행) 찾기: 세로줄마다 아래부터 물 → 빈칸 → 물 이 나오면 앞으로 넘어간 물이 있다는 뜻 */
function overhang(){ const c=P.hc*1.2, nx=Math.ceil(P.L/c), ny=Math.ceil(P.D*3/c), occ=new Uint8Array(nx*ny);
  for(let i=0;i<N;i++){ const a=Math.min(nx-1,(X[i]/c)|0), b=Math.min(ny-1,Math.max(0,(Y[i]/c)|0)); occ[b*nx+a]=1; }
  let cols=0, maxGap=0, at=-1;
  for(let a=0;a<nx;a++){ let st=0, gap=0, best=0; for(let b=0;b<ny;b++){ const o=occ[b*nx+a]; if(st===0&&o) st=1; else if(st===1&&!o){ st=2; gap=1; } else if(st===2&&!o) gap++; else if(st===2&&o){ if(gap>=2) best=Math.max(best,gap); st=1; gap=0; } }
    if(best>0){ cols++; if(best>maxGap){ maxGap=best; at=a*c; } } }
  return {cols, gap:maxGap*c, at}; }
window.__oh=overhang; window.__sim={get N(){return N;}, get t(){return t;}};
/* 그리기 */
let mode="water";
function draw(){ const W=cv.width, H=cv.height, V0=14, sc=W/(P.L-V0), oy=H-10, yy=y=>oy-y*sc, xx=x=>(x-V0)*sc;   /* 비탈 쪽만 크게 */
  g.fillStyle="#0b2fa8"; g.fillRect(0,0,W,H);
  g.fillStyle="#cfe3ff"; g.fillRect(0,0,W,yy(P.D*2.4));
  /* 비탈·바닥 */
  g.fillStyle="#f6efe0"; g.beginPath(); g.moveTo(0,H); g.lineTo(0,yy(0)); g.lineTo(xx(P.xs),yy(0)); for(let x=P.xs;x<=P.L;x+=0.25) g.lineTo(xx(x),yy(bed(x))); g.lineTo(W,H); g.closePath(); g.fill();
  /* 물: 알갱이를 겹쳐 칠해 한 덩어리 물처럼 */
  const r=rP*sc*1.6;
  for(let i=0;i<N;i++){ let col="#36d0dd"; if(mode==="speed"){ const v=Math.hypot(VX[i],VY[i]); col=v>6?"#ffffff":v>4?"#a8f0f5":v>2?"#5fe0e6":"#20b5c8"; } if(X[i]<V0-1) continue; g.fillStyle=col; g.beginPath(); g.arc(xx(X[i]),yy(Y[i]),r,0,6.283); g.fill(); }
  
  const o=overhang(); if(o.cols>2){ g.strokeStyle="#FBE01E"; g.lineWidth=3; g.strokeRect(xx(o.at)-30,yy(P.D*2.2),60,yy(-0.2)-yy(P.D*2.2)); }
  $("stat").textContent=`알갱이 ${N}개 · ${Math.round(fps)}fps · 계산 ${simMs.toFixed(0)}ms · 혀(넘어간 물) ${o.cols>2?("있음, 틈 "+o.gap.toFixed(2)):"없음"}`; }
let last=performance.now(), fps=60, simMs=0;
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.05,(now-last)/1000); last=now; fps=fps*0.9+(1/Math.max(1e-3,dt))*0.1;
  if(!paused){ const t0=performance.now(); const sub=2; for(let s=0;s<sub;s++) step(1/60/sub); simMs=simMs*0.9+(performance.now()-t0)*0.1; }
  draw(); }
$("bPush").onclick=()=>{ pushT=t+0.05; };
$("bAuto").onclick=()=>{ auto=!auto; $("bAuto").setAttribute("aria-pressed",auto); };
$("bPause").onclick=()=>{ paused=!paused; $("bPause").setAttribute("aria-pressed",paused); };
$("bReset").onclick=()=>init();
$("rH").oninput=e=>{ P.H=+e.target.value; $("oH").textContent=P.H.toFixed(2); };
$("rS").oninput=e=>{ P.slope=+e.target.value; $("oS").textContent=P.slope.toFixed(3); init(); };
$("vMode").onchange=e=>{ mode=e.target.value; };
init(); requestAnimationFrame(frame);
window.__step=(n)=>{ for(let i=0;i<n;i++) step(1/120); };
})();
</script>
</body>
</html>
