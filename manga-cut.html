<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANGA CUT — 만화 칸으로 조각 자르기</title>
<style>
:root{--ink:#111;--paper:#fafaf8;--line:#d9d8d3;--mute:#6b6a66;--accent:#D85A30;--soft:#f1f0ec;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
header b{font-family:var(--font-mono);letter-spacing:.08em;font-size:15px}header span{color:var(--mute);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 52px)}
.view{padding:16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.vbar .sp{flex:1}.vbar small{color:var(--mute);font-size:12px}
#cv2,#cv3{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
#cv2{cursor:crosshair}#cv3{height:min(70vh,640px);background:#e8e7e3;touch-action:none}
#st{font-size:12.5px;color:var(--mute);font-family:var(--font-mono);min-height:1.6em}#st.warn{color:#a3361a}
aside{display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{flex:1;padding:11px 6px;border:0;border-bottom:2px solid transparent;background:none;font:600 12.5px var(--font-mono);color:var(--mute);cursor:pointer;white-space:nowrap}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#ctl{padding:6px 18px 30px;overflow-y:auto}
.sec{padding:14px 0;border-bottom:1px solid var(--soft)}.sec h3{margin:0 0 6px;font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.hint{margin:0 0 8px;color:var(--mute);font-size:12.5px}.hint b{color:var(--ink)}
.row{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.row em{font-style:normal;text-align:right;color:var(--mute);font-family:var(--font-mono);font-size:12px}
.row input[type=range]{width:100%;accent-color:var(--ink)}
.row select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button,.filebtn{font:600 12px var(--font-mono);padding:7px 11px;border:1px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center}
button.on,button.primary,.filebtn.primary{background:var(--ink);color:#fff}button.ghost{border-color:var(--line);color:var(--mute)}button.wide{width:100%;justify-content:center;margin:6px 0}
button:disabled{opacity:.5;cursor:wait}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--mute);margin-top:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp figure{margin:0}.cmp canvas{width:100%;border:1px solid var(--line);border-radius:5px}.cmp figcaption{font-size:11.5px;color:var(--mute);text-align:center}
.saverow{display:flex;gap:6px}.saverow input{flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.saveitem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft)}.saveitem small{display:block;color:var(--mute);font-size:11.5px}.saveitem>div:last-child{display:flex;gap:4px;flex-shrink:0}
.rep{font-size:12.5px;padding:4px 0}.warn{color:#a3361a}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.view{border-right:0;border-bottom:1px solid var(--line)}#cv3{height:56vh}}
</style></head>
<body>
<header><b>MANGA CUT</b><span>만화 칸 구성으로 조각을 잘라 보는 도구 — 만화 컷 · 3D 조각 · STL</span></header>
<div class="wrap">
<section class="view">

<canvas id="cv2"></canvas><canvas id="cv3" style="display:none"></canvas>
<div id="st">준비 중…</div>
