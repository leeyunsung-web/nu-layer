<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NU JET 3D</title>
<style>
/* 배치: 왼쪽(좁은 화면에서는 위) 남색 무대, 오른쪽(아래) 조절 판. NU JET과 같은 색과 버튼 */
:root{
  --bg:#FBF8F7; --panel:#FFFFFF; --ink:#33123A; --soft:#7A5C80; --line:#9C2F86; --pink:#F9618D; --yellow:#FBE01E; --night:#00012A;
  --ui:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1C0E22; --panel:#28152F; --ink:#FBEAF1; --soft:#C39FC6; --line:#E06BC6; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1C0E22; --panel:#28152F; --ink:#FBEAF1; --soft:#C39FC6; --line:#E06BC6; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.14em}
header p{margin:0;color:var(--soft);font-size:13px;max-width:70ch}
header a{color:var(--line);font-weight:800}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){ .main{grid-template-columns:minmax(0,1fr)} }
.stagebox{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--night);aspect-ratio:16/10;width:100%;touch-action:none;cursor:grab}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.stage:fullscreen{border:0;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#E9DDF5;font-size:14px;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;min-height:40px;padding:6px 15px;cursor:pointer;white-space:nowrap}
button[aria-pressed="true"]{background:var(--pink);color:#33123A;border-color:#9C2F86}
button.hot{background:var(--yellow);color:#33123A;border-color:#9C2F86;font-size:15px;padding-inline:22px}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#stat{margin-left:auto;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:13px;font-weight:700}
.ctl output{text-align:right;font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--line)}
.desc{grid-column:1/-1;font-size:11.5px;line-height:1.4;color:var(--soft);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:13px;font-weight:700;margin-right:4px}
h3{margin:4px 0 0;font-size:12px;letter-spacing:.08em;color:var(--soft)}
.note{font-size:11.5px;color:var(--soft);margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{font-size:13px;font-weight:800;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--panel)}
.tabs a[aria-current="page"]{background:var(--pink);color:#33123A}
#cfgTxt{width:100%;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NU JET 3D</h1>
    <nav class="tabs" aria-label="수조 고르기"><a href="nu-jet-3d.html" aria-current="page">알갱이 파도</a><a href="nu-sea-3d.html">넓은 바다</a></nav>
    <p>입체 수조 실험. 방울 수만 개를 그래픽카드로 계산해 파도를 만듭니다. 화면을 끌면 수조가 돌아가고, 휠로 가까이·멀리 봅니다. 두 번 누르면 물 덩어리가 떨어집니다. <a href="nu-jet.html">← NU JET (2D)</a></p>
  </header>
  <div class="main">
    <div class="stagebox">
      <div class="stage" id="stage"><canvas id="cv" aria-label="3D 수조 화면"></canvas><div class="msg" id="msg">그래픽카드를 준비하는 중…</div></div>
      <div class="bar">
        <button id="bSlap" class="hot" type="button" title="파도 판을 한 번 세게 밉니다 (스페이스 키)" data-sc="0">철썩!</button>
        <button id="bWave" type="button" aria-pressed="true" data-sc="0">파도 판 움직이기</button>
        <button id="bDrip" class="hot" type="button" title="물방울 하나를 떨어뜨립니다 (스페이스 키)" data-sc="1">퐁!</button>
        <button id="bAuto" type="button" aria-pressed="true" data-sc="1">계속 떨어뜨리기</button>
        <button id="bDrop" type="button">물 덩어리</button>
        <button id="bFill" type="button">다시 채우기</button>
        <button id="bPause" type="button" aria-pressed="false">멈춤</button>
        <button id="bFull" type="button">전체 화면</button>
        <span id="stat"></span>
      </div>
    </div>
    <aside class="panel" id="panel">
      <div class="row" id="scenes"><span class="lab">장면</span><button type="button" data-s="0">파도</button><button type="button" data-s="1">물방울</button></div>
      <div class="row" id="views"><span class="lab">시점</span></div>
      <h3>수조</h3>
      <div id="secTank"></div>
      <h3 data-sc="0">파도</h3>
      <div id="secWave" data-sc="0"></div>
      <h3 data-sc="1">물방울</h3>
      <div id="secDrop" data-sc="1"></div>
      <h3>액체</h3>
      <div class="row" id="mats"><span class="lab">재료</span><button type="button" data-m="0">물</button><button type="button" data-m="1">젤리</button></div>
      <div id="secLiq"></div>
      <h3>화면</h3>
      <div class="row" id="rmodes"><span class="lab">그리기</span><button type="button" data-r="0">물 표면</button><button type="button" data-r="1">방울 점</button></div>
      <div class="row" id="colors"><span class="lab">색</span></div>
      <div class="row" id="skies"><span class="lab">하늘</span></div>
      <div id="secLook"></div>
      <div class="row"><button id="bReset" type="button">처음 값으로</button><button id="bCopy" type="button">설정 복사</button><button id="bPasteOpen" type="button">설정 붙여넣기</button></div>
      <div id="cfgBox" hidden>
        <textarea id="cfgTxt" rows="5" spellcheck="false" aria-label="설정 글"></textarea>
        <div class="row"><button id="bApply" type="button">이 설정 적용</button><span class="note" id="cfgMsg"></span></div>
      </div>
      <p class="note">물 표면: 가까운 방울끼리 깊이를 녹여 이은 매끈한 면에 셀 채색을 입힙니다. 붙어 있는 물은 한 덩어리로, 떨어져 나간 방울은 따로 보입니다. 방울 점: 계산 그대로를 점으로 봅니다.</p>
    </aside>
  </div>
</div>

struct P { g: vec4u, a: vec4f, b: vec4f, c: vec4f, d: vec4f, e: vec4f, f: vec4f, h: vec4f };
@group(0) @binding(0) var<uniform> U: P;
@group(0) @binding(1) var<storage, read_write> pos: array<vec4f>;

@group(0) @binding(6) var<storage, read_write> Fm: array<mat3x3f>;
/* 작은 물보라 알갱이: 본체에서 튀어 나와 중력·공기 저항만 받아 날아가다, 물이나 바닥에 닿으면 사라진다 (서로 밀고 당기지 않아 가볍다) */
struct Sp { p: vec4f, v: vec4f };   /* p.w = 남은 시간, v.w = 크기(본체 알갱이 대비) */
@group(0) @binding(7) var<storage, read_write> spr: array<Sp>;

const SPMAX: u32 = 262144u;
/* 빈 공간 건너뛰기: 격자를 4×4×4 칸 묶음으로 나눠, 물 알갱이가 있는 묶음(과 그 이웃)만 비우고 계산한다.
   sc 칸: [0] 물보라 수, [1] 계산할 묶음 수, [16..] 묶음마다 '알갱이 있음', 그 뒤 '계산할 묶음' 목록, 그 뒤 '계산함' 표시 */
fn nbx() -> vec3u { return (U.g.xyz + 3u) / 4u; }
fn nblk() -> u32 { let n = nbx(); return n.x * n.y * n.z; }
fn bidx(c: vec3u) -> u32 { let b = c / 4u; let n = nbx(); return b.x + n.x * (b.y + n.y * b.z); }
/* 알갱이 속도 칸의 네 번째 값에 밀도·스며듦·거품을 함께 담는다 (따로 큰 칸을 읽고 쓰지 않게) */
fn packAux(dn: f32, sk: f32, fo: f32, rn: f32) -> f32 {
  /* 7칸짜리 눈금이라 그냥 반올림하면 조금씩 줄어드는 값이 영영 안 줄어든다 → 제비뽑기로 올림/내림 */
  let d = pack2x16float(vec2f(min(dn, 60000.0), 0.0)) & 0xFFFFu;
  let a = min(127u, u32(clamp(sk, 0.0, 1.0) * 127.0 + rn)); let b = min(127u, u32(clamp(fo, 0.0, 1.0) * 127.0 + fract(rn * 7.31)));
  return bitcast<f32>(d | (a << 16u) | (b << 23u));
}
fn auxSoak(w: f32) -> f32 { return f32((bitcast<u32>(w) >> 16u) & 127u) / 127.0; }
fn auxFoam(w: f32) -> f32 { return f32((bitcast<u32>(w) >> 23u) & 127u) / 127.0; }
@compute @workgroup_size(64) fn bClear(@builtin(global_invocation_id) id: vec3u) {
  if (id.x == 0u) { atomicStore(&sc[1], 0u); }
  if (id.x < nblk()) { atomicStore(&sc[16u + id.x], 0u); }
}
@compute @workgroup_size(64) fn bMark(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= U.g.w) { return; } let q = pos[id.x]; if (q.w <= 0.0) { return; }
  let c = vec3u(clamp(vec3i(floor(q.xyz)), vec3i(0), vec3i(U.g.xyz) - 1));
  atomicStore(&sc[16u + bidx(c)], 1u);
}
@compute @workgroup_size(64) fn bBuild(@builtin(global_invocation_id) id: vec3u) {
  let nb = nblk(); if (id.x >= nb) { return; }
  let n = nbx(); let b = vec3i(i32(id.x % n.x), i32((id.x / n.x) % n.y), i32(id.x / (n.x * n.y)));
  var on = 0u;
  for (var dz = -1; dz <= 1; dz++) { for (var dy = -1; dy <= 1; dy++) { for (var dx = -1; dx <= 1; dx++) {
    let o = b + vec3i(dx, dy, dz);
    if (all(o >= vec3i(0)) && all(o < vec3i(n))) { on = on | atomicLoad(&sc[16u + u32(o.x) + n.x * (u32(o.y) + n.y * u32(o.z))]); }
  }}}
  atomicStore(&sc[16u + 2u * nb + id.x], on);
  if (on != 0u) { let k = atomicAdd(&sc[1], 1u); atomicStore(&sc[16u + nb + k], id.x); }
}
/* 계산할 묶음 하나 = 일꾼 64명(4×4×4 칸) */
fn blkCell(wg: u32, l: u32) -> vec4u {
  let nb = nblk(); let b = atomicLoad(&sc[16u + nb + wg]); let n = nbx();
  let c = vec3u(b % n.x, (b / n.x) % n.y, b / (n.x * n.y)) * 4u + vec3u(l % 4u, (l / 4u) % 4u, l / 16u);
  return vec4u(c, select(0u, 1u, all(c < U.g.xyz)));
}
const FP: f32 = 1e5;
const I3 = mat3x3f(1,0,0, 0,1,0, 0,0,1);
fn enc(x: f32) -> i32 { return i32(clamp(x, -20000.0, 20000.0) * FP); }
fn dec(x: i32) -> f32 { return f32(x) / FP; }
fn gidx(c: vec3i) -> u32 { return u32(c.x) + U.g.x * (u32(c.y) + U.g.y * u32(c.z)); }
fn wts(d: vec3f) -> array<vec3f,3> { return array<vec3f,3>(0.5*(0.5-d)*(0.5-d), 0.75-d*d, 0.5*(0.5+d)*(0.5+d)); }
/* 벌어진 수조: 파도가 시작되는 쪽(파도 판, x가 작은 쪽)이 앞뒤로 가장 넓고, 해변 쪽으로 갈수록 좁아진다. d.w = 해변 쪽을 좁히는 정도 */
fn zwalls(x: f32) -> vec2f {   /* 파도 판 쪽 폭(b.w)에서 해변 쪽 폭(d.w)으로 곧게 바뀐다 (둘 다 절반 값) */
  let lo = 3.0; let hi = f32(U.g.x) - 4.0; let zc = (3.0 + f32(U.g.z) - 4.0) * 0.5;
  let t = clamp((x - lo) / max(hi - lo, 1.0), 0.0, 1.0); let hd = mix(U.b.w, U.d.w, t); return vec2f(zc - hd, zc + hd);
}
fn zslope() -> f32 { return (U.b.w - U.d.w) / max(f32(U.g.x) - 7.0, 1.0); }
fn hh(v: vec3f) -> f32 { return fract(sin(dot(v, vec3f(12.9898, 78.233, 37.719))) * 43758.5453); }
fn beachX() -> f32 { return 3.0 + 0.45 * (f32(U.g.x) - 7.0); }
fn floorY(x: f32) -> f32 { if (U.c.x > 0.0 && x > beachX()) { return 2.0 + U.c.x * (x - beachX()); } return 2.0; }

@compute @workgroup_size(64) fn clearGrid(@builtin(global_invocation_id) id: vec3u) {
  let n = U.g.x*U.g.y*U.g.z; if (id.x >= n) { return; }
  let i = id.x*4u; atomicStore(&gi[i],0); atomicStore(&gi[i+1u],0); atomicStore(&gi[i+2u],0); atomicStore(&gi[i+3u],0);
}
@compute @workgroup_size(64) fn clearGridS(@builtin(workgroup_id) w: vec3u, @builtin(local_invocation_index) l: u32) {
  let c = blkCell(w.x, l); if (c.w == 0u) { return; }
  let i = gidx(vec3i(c.xyz)) * 4u; atomicStore(&gi[i],0); atomicStore(&gi[i+1u],0); atomicStore(&gi[i+2u],0); atomicStore(&gi[i+3u],0);
}
/* 방울 → 격자 (한 번에): 질량, 운동량, 그리고 '모양 기억'에서 나온 누르는 힘·당기는 힘을 함께 뿌린다 */
/* 1단계: 무게만 격자에 모은다 (칸마다 1번만 더하기) */
@compute @workgroup_size(64) fn p2gMass(@builtin(global_invocation_id) id: vec3u) {
  let pi = id.x; if (pi >= U.g.w) { return; }
  let q = pos[pi]; if (q.w <= 0.0) { return; }        /* 사라진 방울 */
  let p = q.xyz; let m = 1.0;                          /* 무게는 그대로 (사라지는 중인 방울은 보이는 크기만 줄고, 다 줄면 빠진다) */
  let cell = vec3i(floor(p)); let d = p - vec3f(cell) - 0.5; let w = wts(d);
  for (var gx = 0; gx < 3; gx++) { for (var gy = 0; gy < 3; gy++) { for (var gz = 0; gz < 3; gz++) {
    atomicAdd(&gi[gidx(cell + vec3i(gx-1, gy-1, gz-1)) * 4u], enc(m * w[gx].x * w[gy].y * w[gz].z));

fn updAt(cid: u32) {

@compute @workgroup_size(64) fn g2p(@builtin(global_invocation_id) id: vec3u) {

  var v = vec3f(0.0); var B = mat3x3f(0,0,0,0,0,0,0,0,0); var dens = 0.0;
  for (var gx = 0; gx < 3; gx++) { for (var gy = 0; gy < 3; gy++) { for (var gz = 0; gz < 3; gz++) {
    let wt = w[gx].x * w[gy].y * w[gz].z;

const RWGSL=/* wgsl */`
struct Cam { vp: mat4x4f, view: mat4x4f, c0: vec4f, c1: vec4f, c2: vec4f, c3: vec4f, prm: vec4f, ext: vec4f, ext2: vec4f, ext3: vec4f, s0: vec4f, s1: vec4f, s2: vec4f, s3: vec4f, sun: vec4f, g0: vec4f, g1: vec4f, sand: vec4f, ex4: vec4f, ex5: vec4f, ex6: vec4f };
@group(0) @binding(0) var<uniform> K: Cam;
@group(0) @binding(1) var<storage, read> pos: array<vec4f>;
@group(0) @binding(2) var<storage, read> vel: array<vec4f>;
@group(0) @binding(3) var<storage, read> sp: array<vec4f>;
/* 보이는 자리: 계산한 자리의 앞뒤(z)를 x에 따라 시작 폭→끝 폭 비율로 늘인다 (계산량은 그대로) */
fn auxDens(w: f32) -> f32 { return unpack2x16float(bitcast<u32>(w) & 0xFFFFu).x; }
fn auxFoam(w: f32) -> f32 { return f32((bitcast<u32>(w) >> 23u) & 127u) / 127.0; }

struct VO { @builtin(position) p: vec4f, @location(0) uv: vec2f, @location(1) s: f32, @location(2) dz: f32 };
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  var cs = array<vec2f,6>(vec2f(-1,-1), vec2f(1,-1), vec2f(-1,1), vec2f(-1,1), vec2f(1,-1), vec2f(1,1));
  let c = cs[vi];
  let wp = wmap(pos[ii].xyz) - vec3f(K.prm.y, K.prm.z, K.prm.w) * 0.5;
  var vp = K.view * vec4f(wp, 1.0);

  var o: VO; o.p = K.vp * vp; o.uv = c; o.s = length(vel[ii].xyz); o.dz = -vp.z;

}
@vertex fn vsSp(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  var cs = array<vec2f,6>(vec2f(-1,-1), vec2f(1,-1), vec2f(-1,1), vec2f(-1,1), vec2f(1,-1), vec2f(1,1));
  let c = cs[vi]; let q = sp[ii * 2u]; let w = sp[ii * 2u + 1u];
  var vp = K.view * vec4f(wmap(q.xyz) - vec3f(K.prm.y, K.prm.z, K.prm.w) * 0.5, 1.0);
  vp = vec4f(vp.xy + c * K.prm.x * K.ex4.w * w.w, vp.z, 1.0);
  var o: VO; o.p = K.vp * vp; o.uv = c; o.s = 0.0; o.dz = -vp.z;
  if (q.w <= 0.0) { o.p = vec4f(9.0, 9.0, 9.0, 1.0); }

}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let r2 = dot(i.uv, i.uv); if (r2 > 1.0) { discard; }
  let n = vec3f(i.uv.x, -i.uv.y, sqrt(1.0 - r2));
  let L = normalize(vec3f(-0.5, 0.7, 0.6));
  let ndl = dot(n, L);

  if (ndl > 0.93) { col = K.c2.rgb; }
  if (i.s > K.c3.w) { col = mix(col, vec3f(1.0), 0.75); }
  if (r2 > 0.8) { col = K.c3.rgb; }

  const e=dev.createCommandEncoder();
  if(SURF){ const rp=(view,clear,bg,pl,count,inst,depthTex)=>{ const q=e.beginRenderPass({colorAttachments:[{view,clearValue:{r:clear,g:0,b:0,a:0},loadOp:"clear",storeOp:"store"}],...(depthTex?{depthStencilAttachment:{view:depthTex.createView(),depthClearValue:1,depthLoadOp:"clear",depthStoreOp:"store"}}:{})}); q.setPipeline(pl); q.setBindGroup(0,bg); q.draw(count,inst); q.end(); };
    { const q=e.beginRenderPass({colorAttachments:[{view:T.dep.createView(),clearValue:{r:1e6,g:0,b:0,a:0},loadOp:"clear",storeOp:"store"}],depthStencilAttachment:{view:T.hw.createView(),depthClearValue:1,depthLoadOp:"clear",depthStoreOp:"store"}});
      q.setBindGroup(0,T.bgDep); if(N){ q.setPipeline(PL.sDepth); q.draw(6,N); } if(S.mat===0){ q.setPipeline(PL.sDepthS); q.draw(6,262144); } q.end(); }
    if(S.brd>0){ rp(T.sm.createView(),1e6,T.bgH1,PL.sBrH,3,1); rp(T.dep.createView(),1e6,T.bgH2,PL.sBrV,3,1); }   /* 알갱이 잇기: 깊이 → 가로 잇기 → 세로 잇기 → 다시 깊이 그림 */
    rp(T.tmp.createView(),1e6,T.bgH1,PL.sBH,3,1); rp(T.sm.createView(),1e6,T.bgV,PL.sBV,3,1);
    rp(T.tmp.createView(),1e6,T.bgH2,PL.sBH,3,1); rp(T.sm.createView(),1e6,T.bgV,PL.sBV,3,1);
    rp(T.fo.createView(),0,T.bgFoam,PL.sFoam,6,N); }
  const p=e.beginRenderPass({colorAttachments:[{view:OFF?offTex.createView():ctx.getCurrentTexture().createView(),clearValue:S.sky==="off"?{r:1,g:1,b:1,a:1}:{r:0,g:1/255,b:42/255,a:1},loadOp:"clear",storeOp:"store"}],depthStencilAttachment:{view:depth.createView(),depthClearValue:1,depthLoadOp:"clear",depthStoreOp:"store"}});
  p.setBindGroup(0,BGR); if(S.sky!=="off"){ p.setPipeline(PL.sky); p.draw(3); }
  if(sandN){ p.setPipeline(PL.sand); p.setVertexBuffer(0,sandBuf); p.draw(sandN); }
  if(SURF){ p.setPipeline(PL.sComp); p.setBindGroup(0,T.bgComp); p.draw(3); p.setBindGroup(0,BGR); }
  else { if(N){ p.setPipeline(PL.draw); p.draw(6,N); } if(S.mat===0){ p.setPipeline(PL.drawS); p.draw(6,262144); } }
  p.setPipeline(PL.line); p.setVertexBuffer(0,lineBuf); p.draw(lineN);
  p.end(); dev.queue.submit([e.finish()]); if(OFF){ inflight++; dev.queue.onSubmittedWorkDone().then(()=>{ inflight--; }); }
  fN++; fT+=dt; if(fT>=0.5){ $("stat").textContent=N.toLocaleString()+"알 · "+Math.round(fN/fT)+"fps · 1초 "+Math.round(stepsN/fT)+"박자"+(slowF>0?" · 그래픽카드가 따라가지 못해 조금 느리게 흐르는 중":""); fN=0; fT=0; stepsN=0; }
  requestAnimationFrame(frame);
}

/* ── 손잡이 ── */
const stage=$("stage"), ORB={pts:new Map(),x:0,y:0,d0:0};
stage.addEventListener("pointerdown",e=>{ stage.setPointerCapture(e.pointerId); ORB.pts.set(e.pointerId,[e.clientX,e.clientY]); ORB.x=e.clientX; ORB.y=e.clientY; if(ORB.pts.size===2){ const [a,b]=[...ORB.pts.values()]; ORB.d0=Math.hypot(a[0]-b[0],a[1]-b[1]); } });
stage.addEventListener("pointermove",e=>{ if(!ORB.pts.has(e.pointerId)) return; ORB.pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(ORB.pts.size===2){ const [a,b]=[...ORB.pts.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(ORB.d0>0) S.czoom=Math.min(4,Math.max(0.4,S.czoom*d/ORB.d0)); ORB.d0=d; return; }
  S.cyaw=((S.cyaw-(e.clientX-ORB.x)*0.4)+540)%360-180; S.cpit=Math.min(85,Math.max(-5,S.cpit+(e.clientY-ORB.y)*0.3)); ORB.x=e.clientX; ORB.y=e.clientY; });
const up=e=>{ ORB.pts.delete(e.pointerId); ORB.d0=0; save(); };
stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",e=>{ e.preventDefault(); S.czoom=Math.min(4,Math.max(0.4,S.czoom*Math.exp(-e.deltaY*0.0012))); save(); },{passive:false});
stage.addEventListener("dblclick",()=>S.scene===1?spawnDrop():dropBlob());
$("bSlap").addEventListener("click",()=>{ SLAP=1; });
$("bWave").addEventListener("click",()=>{ waveOn=!waveOn; $("bWave").setAttribute("aria-pressed",waveOn?"true":"false"); });
$("bDrop").addEventListener("click",()=>S.scene===1?spawnDrop():dropBlob());
$("bDrip").addEventListener("click",spawnDrop);
$("bAuto").addEventListener("click",()=>{ autoDrip=!autoDrip; $("bAuto").setAttribute("aria-pressed",autoDrip?"true":"false"); });
$("bFill").addEventListener("click",()=>{ if(E.ok) fill(); });
$("bPause").addEventListener("click",()=>{ paused=!paused; $("bPause").setAttribute("aria-pressed",paused?"true":"false"); });
$("bFull").addEventListener("click",()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen(); }catch(_){} });
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.code==="Space"){ e.preventDefault(); if(S.scene===1) spawnDrop(); else SLAP=1; } else if(e.key==="f"||e.key==="F") $("bFull").click(); });

/* 점검용: 방울 위치를 읽어 온다 */
window.__nj3={ async snap(){ const w=cv.width, h=cv.height, bpr=Math.ceil(w*4/256)*256, rb=dev.createBuffer({size:bpr*h,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}); const e=dev.createCommandEncoder(); e.copyTextureToBuffer({texture:offTex},{buffer:rb,bytesPerRow:bpr},[w,h]); dev.queue.submit([e.finish()]); await rb.mapAsync(GPUMapMode.READ); const a=new Uint8Array(rb.getMappedRange()); let c=document.getElementById("snap"); if(!c){ c=document.createElement("canvas"); c.id="snap"; c.style.cssText="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"; $("stage").appendChild(c); } c.width=w; c.height=h; const g=c.getContext("2d"), im=g.createImageData(w,h); for(let y=0;y<h;y++) im.data.set(a.subarray(y*bpr,y*bpr+w*4),y*w*4); g.putImageData(im,0,0); rb.unmap(); rb.destroy(); }, get n(){ return N; }, set sort(v){ sortOn=!!v; }, get S(){ return S; }, slap(){ SLAP=1; }, fill:()=>fill(), async probe(){ const k=Math.min(N,20000), rb=dev.createBuffer({size:k*16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}); const e=dev.createCommandEncoder(); e.copyBufferToBuffer(B.pos,0,rb,0,k*16); dev.queue.submit([e.finish()]); await rb.mapAsync(GPUMapMode.READ); const a=new Float32Array(rb.getMappedRange().slice(0)); rb.unmap(); rb.destroy();
  let bad=0, my=0, mxy=-1e9, mx=0; for(let i=0;i<k;i++){ const x=a[i*4], y=a[i*4+1], z=a[i*4+2]; if(!isFinite(x)||!isFinite(y)||!isFinite(z)) bad++; else { my+=y; mx+=x; if(y>mxy) mxy=y; } } return {k,bad,meanY:my/k,maxY:mxy,meanX:mx/k,padX:PADX}; } };
init().catch(e=>{ $("msg").hidden=false; $("msg").textContent="그래픽카드를 준비하지 못했어요: "+e.message; console.error(e); });
})();
