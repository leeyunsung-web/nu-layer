<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NU SEA 3D</title>
<style>
/* 배치: 왼쪽(좁은 화면에서는 위) 남색 무대, 오른쪽(아래) 조절 판. NU JET과 같은 색과 버튼 */
:root{
  --bg:#FBF8F7; --panel:#FFFFFF; --ink:#33123A; --soft:#7A5C80; --line:#9C2F86; --pink:#F9618D; --yellow:#FBE01E; --night:#00012A;
  --ui:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1C0E22; --panel:#28152F; --ink:#FBEAF1; --soft:#C39FC6; --line:#E06BC6; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1C0E22; --panel:#28152F; --ink:#FBEAF1; --soft:#C39FC6; --line:#E06BC6; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.14em}
header p{margin:0;color:var(--soft);font-size:13px;max-width:70ch}
header a{color:var(--line);font-weight:800}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){ .main{grid-template-columns:minmax(0,1fr)} }
.stagebox{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--night);aspect-ratio:16/10;width:100%;touch-action:none;cursor:grab}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.stage:fullscreen{border:0;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#E9DDF5;font-size:14px;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;min-height:40px;padding:6px 15px;cursor:pointer;white-space:nowrap}
button[aria-pressed="true"]{background:var(--pink);color:#33123A;border-color:#9C2F86}
button.hot{background:var(--yellow);color:#33123A;border-color:#9C2F86;font-size:15px;padding-inline:22px}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#stat{margin-left:auto;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:13px;font-weight:700}
.ctl output{text-align:right;font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--line)}
.desc{grid-column:1/-1;font-size:11.5px;line-height:1.4;color:var(--soft);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:13px;font-weight:700;margin-right:4px}
h3{margin:4px 0 0;font-size:12px;letter-spacing:.08em;color:var(--soft)}
.note{font-size:11.5px;color:var(--soft);margin:0}
#cfgTxt{width:100%;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;resize:vertical}
</style>

<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{font-size:13px;font-weight:800;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--panel)}
.tabs a[aria-current="page"]{background:var(--pink);color:#33123A}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NU SEA 3D</h1>
    <nav class="tabs" aria-label="수조 고르기"><a href="https://leeyunsung-web.github.io/nu-layer/nu-jet-3d.html">알갱이 파도</a><a href="https://leeyunsung-web.github.io/nu-layer/nu-sea-3d.html" aria-current="page">넓은 바다</a></nav>
    <p>넓은 바다 실험. 바다 본체는 '자리마다 물 높이'만 계산해 아주 넓고 고운 바다를 가볍게 만들고, 파도가 부서지는 곳에서만 작은 물보라 알갱이를 흩뿌립니다. 화면을 끌면 돌아가고, 휠로 가까이·멀리 봅니다.</p>
  </header>
  <div class="main">
    <div class="stagebox">
      <div class="stage" id="stage"><canvas id="cv" aria-label="3D 바다 화면"></canvas><div class="msg" id="msg">그래픽카드를 준비하는 중…</div></div>
      <div class="bar">
        <button id="bSlap" class="hot" type="button" title="큰 파도 한 번 (스페이스 키)">철썩!</button>
        <button id="bWave" type="button" aria-pressed="true">파도 만들기</button>
        <button id="bFill" type="button">다시 채우기</button>
        <button id="bPause" type="button" aria-pressed="false">멈춤</button>
        <button id="bFull" type="button">전체 화면</button>
        <span id="stat"></span>
      </div>
    </div>
    <aside class="panel" id="panel">
      <div class="row" id="views"><span class="lab">시점</span></div>
      <h3>바다</h3>
      <div id="secSea"></div>
      <h3>파도</h3>
      <div id="secWave"></div>
      <h3>화면</h3>
      <div class="row" id="colors"><span class="lab">색</span></div>
      <div class="row" id="skies"><span class="lab">하늘</span></div>
      <div id="secLook"></div>
      <div class="row"><button id="bReset" type="button">처음 값으로</button><button id="bCopy" type="button">설정 복사</button><button id="bPasteOpen" type="button">설정 붙여넣기</button></div>
      <div id="cfgBox" hidden>
        <textarea id="cfgTxt" rows="5" spellcheck="false" aria-label="설정 글"></textarea>
        <div class="row"><button id="bApply" type="button">이 설정 적용</button><span class="note" id="cfgMsg"></span></div>
      </div>
      <p class="note">바다 본체는 높이 지도로 계산해 넓어도 가볍습니다. 대신 파도가 말려 부서지는 모양은 직접 만들지 못해, 부서지는 곳은 흰 거품과 작은 물보라 알갱이로 나타냅니다.</p>
    </aside>
  </div>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
/* 문제가 생기면 화면에 그대로 적어 보여 준다 (무엇이 잘못됐는지 알려 주기 위해) */
const ERRS=[]; function showErr(t){ t=String(t).slice(0,300); if(ERRS.includes(t)) return; ERRS.push(t); const m=$("msg"); if(!m) return; m.hidden=false; m.style.background="rgba(0,1,42,0.85)"; m.style.alignItems="flex-start"; m.style.overflow="auto"; m.textContent="문제가 생겼어요 (이 글을 복사해 보내 주세요):\n"+ERRS.join("\n"); m.style.whiteSpace="pre-wrap"; }
window.addEventListener("error",e=>showErr("JS: "+(e.message||e.error)));
window.addEventListener("unhandledrejection",e=>showErr("JS: "+(e.reason&&e.reason.message||e.reason)));

/* ── 조절값 ── [칸, 이름, 키, 최소, 최대, 간격, 처음 값, 단위, 설명, 다시 채우기] */
const CTL=[
 ["secSea","빠르기","spd",0.1,4,0.05,1,"배","물이 움직이는 빠르기. 낮추면 슬로모션.",0],
 ["secSea","가로","len",64,1024,8,320,"칸","바다의 길이 (파도가 달려가는 쪽). 바꾸면 다시 채웁니다.",1],
 ["secSea","폭","wid",32,512,8,160,"칸","바다의 앞뒤 폭. 바꾸면 다시 채웁니다.",1],
 ["secSea","세밀함","res",128,1024,32,448,"칸","가로를 몇 칸으로 나눠 계산할지. 높을수록 물결이 곱지만 무거워집니다. 바꾸면 다시 채웁니다.",1],
 ["secSea","물 깊이","depth",2,40,0.5,8,"칸","바다 쪽 물의 깊이. 바꾸면 다시 채웁니다.",1],
 ["secSea","해변 시작","bstart",0.3,0.9,0.01,0.6,"%","가로 중 어디서부터 백사장 비탈이 시작될지. 바꾸면 다시 채웁니다.",1],
 ["secSea","해변 경사","slope",0.02,0.5,0.01,0.12,"","백사장 비탈의 기울기. 바꾸면 다시 채웁니다.",1],
 ["secSea","해변 굴곡","curve",0,1,0.02,0.5,"%","해변선이 구불구불한 정도. 바꾸면 다시 채웁니다.",1],
 ["secWave","파도 세기","amp",0,10,0.1,3,"칸","파도가 시작되는 쪽에서 물이 오르내리는 높이.",0],
 ["secWave","파도 주기","per",0.5,14,0.1,4,"초","한 번 오르내리는 시간.",0],
 ["secWave","밀어치기","skew",0,1,0.05,0.5,"%","빨리 솟고 천천히 내려가는 정도. 높이면 파도 앞이 가팔라집니다.",0],
 ["secWave","중력","grav",2,40,0.5,20,"","높을수록 파도가 빨리 달립니다.",0],
 ["secWave","물결 남기기","damp",0.99,1,0.0002,0.9995,"","물결이 오래 남는 정도. 1에 가까울수록 오래 출렁입니다.",0],
 ["secWave","스며들기","soak",0,1,0.02,0.5,"%","백사장으로 쓸려 올라간 얇은 물이 모래에 스며드는 빠르기.",0],
 ["secLook","보는 곳","look",0,1,0.01,0.55,"%","카메라가 바라보는 가로 위치. 0은 파도가 시작되는 쪽, 1은 백사장 끝.",0],
 ["secLook","거품","foam",0,1,0.02,0.6,"%","부서지는 파도, 빠른 물, 해변으로 밀려 올라가는 물에 생기는 흰 거품의 양.",0],
 ["secLook","물보라 양","spray",0,1,0.02,0.5,"%","부서지는 파도 꼭대기에서 흩어지는 작은 물보라 알갱이의 양. 카메라 가까운 곳일수록 많이 생깁니다.",0],
 ["secLook","물보라 크기","spsz",0.1,2,0.02,0.7,"칸","작은 물보라 알갱이의 크기.",0],
 ["secLook","물 색조","whue",-180,180,1,0,"도","물 색의 빛깔을 돌립니다.",0],
 ["secLook","물 채도","wsat",0,2,0.02,1,"배","물 색이 얼마나 짙고 선명한지.",0],
 ["secLook","물 밝기","wbri",0.5,1.5,0.01,1,"배","물 색의 밝기.",0],
 ["secLook","얕은 물 비침","clear",0,1,0.02,0.6,"%","얕은 물에서 바닥 모래가 비쳐 밝아 보이는 정도.",0],
 ["secLook","모래 색","sandc",0,1,0.02,0.08,"%","0이면 하얀 백사장, 높일수록 노란 모래.",0],
 ["secLook","구름 양","cloud",0,1,0.02,0.72,"%","하늘을 덮는 구름의 양.",0],
 ["secLook","구름 빠르기","cspd",0,2,0.02,0.35,"%","구름이 흘러가는 빠르기.",0],
 ["secLook","픽셀 크기","px",1,6,1,2,"px","한 칸의 크기. 클수록 굵은 픽셀 그림이 됩니다.",0],
];
const SKIES={
  day:{n:"낮",hz:[198,232,255],zn:[86,162,238],cw:[255,255,255],cs:[190,208,240],mode:1,sun:[-0.45,0.55,-0.7],g0:[150,208,242],g1:[46,128,200]},
  dusk:{n:"노을",hz:[255,186,150],zn:[118,84,170],cw:[255,228,214],cs:[220,126,156],mode:2,sun:[-0.6,0.07,-0.8],g0:[238,160,150],g1:[110,70,140]},
  off:{n:"끄기",hz:[255,255,255],zn:[255,255,255],cw:[255,255,255],cs:[255,255,255],mode:1,sun:[0,1,0],g0:[255,255,255],g1:[255,255,255]},
  night:{n:"밤",hz:[22,20,74],zn:[0,1,42],cw:[84,76,148],cs:[46,40,104],mode:0,sun:[0.5,0.45,-0.75],g0:[30,28,88],g1:[4,6,40]},
};
const COLORS={
  maldives:{n:"몰디브",c:[[86,218,206],[24,172,184],[236,255,250],[6,104,128]]},
  water:{n:"물",c:[[44,156,224],[22,104,176],[222,246,255],[12,58,120]]},
  milk:{n:"우유",c:[[248,241,228],[222,204,178],[255,255,255],[206,150,30]]},
  blood:{n:"핏빛",c:[[226,60,96],[176,32,74],[255,222,230],[122,22,60]]},
};
const DEF=(()=>{ const o={col:"maldives",sky:"day",cyaw:-30,cpit:20,czoom:1.7}; for(const c of CTL) o[c[2]]=c[6]; return o; })();
const KEY="nu-sea-3d-v1";
let S=Object.assign({},DEF); try{ const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v) for(const k in DEF) if(k in v) S[k]=v[k]; }catch(_){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(_){} };
const fmt=(c,v)=>c[7]==="도"?Math.round(v)+"°":c[7]==="%"?Math.round(v*100)+"%":c[7]==="초"?(+v).toFixed(1)+"초":c[7]==="칸"?(+v).toFixed(1)+"칸":c[7]==="px"?v+"px":c[7]==="배"?(+v).toFixed(2)+"배":(+v).toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
const inputs={}; let refillT=0;
for(const c of CTL){ const w=document.createElement("label"); w.className="ctl"; const sp=document.createElement("span"); sp.textContent=c[1];
  const r=document.createElement("input"); r.type="range"; r.id="k_"+c[2]; r.min=c[3]; r.max=c[4]; r.step=c[5]; r.value=S[c[2]];
  const o=document.createElement("output"); o.textContent=fmt(c,S[c[2]]); const d=document.createElement("small"); d.className="desc"; d.textContent=c[8];
  r.addEventListener("input",()=>{ S[c[2]]=+r.value; o.textContent=fmt(c,S[c[2]]); save(); if(c[9]){ clearTimeout(refillT); refillT=setTimeout(()=>{ if(E.ok) rebuild(); },350); } });
  w.append(sp,r,o,d); $(c[0]).appendChild(w); inputs[c[2]]=[r,o,c]; }
for(const k in COLORS){ const b=document.createElement("button"); b.type="button"; b.dataset.c=k; b.textContent=COLORS[k].n; b.addEventListener("click",()=>{ S.col=k; save(); colUI(); }); $("colors").appendChild(b); }
for(const k in SKIES){ const b=document.createElement("button"); b.type="button"; b.dataset.k=k; b.textContent=SKIES[k].n; b.addEventListener("click",()=>{ S.sky=k; save(); colUI(); }); $("skies").appendChild(b); }
function colUI(){ for(const b of document.querySelectorAll("#colors button")) b.setAttribute("aria-pressed",b.dataset.c===S.col?"true":"false"); for(const b of document.querySelectorAll("#skies button")) b.setAttribute("aria-pressed",b.dataset.k===S.sky?"true":"false"); }
for(const [nm,y,p,z,l] of [["비스듬히",-30,20,1.7,0.55],["옆모습",0,4,1.4,0.5],["위에서",-20,62,1.2,0.5],["백사장",-62,14,3.2,0.72],["물가에서",-96,8,2.4,0.8]]){ const b=document.createElement("button"); b.type="button"; b.textContent=nm; b.addEventListener("click",()=>{ S.cyaw=y; S.cpit=p; S.czoom=z; S.look=l; save(); syncUI(); }); $("views").appendChild(b); }
function syncUI(){ for(const k in inputs){ const [r,o,c]=inputs[k]; r.value=S[k]; o.textContent=fmt(c,S[k]); } colUI(); }
colUI();
const cfgText=()=>JSON.stringify(Object.fromEntries(Object.keys(DEF).map(k=>[k,typeof S[k]==="number"?Math.round(S[k]*1000)/1000:S[k]])));
$("bCopy").addEventListener("click",async()=>{ const t=cfgText(); $("cfgBox").hidden=false; $("cfgTxt").value=t; $("cfgTxt").select();
  try{ await navigator.clipboard.writeText(t); $("cfgMsg").textContent="복사했어요. 이 글을 그대로 붙여 보내 주면 됩니다."; }catch(_){ $("cfgMsg").textContent="위 글을 직접 복사해 주세요."; } });
$("bPasteOpen").addEventListener("click",()=>{ $("cfgBox").hidden=false; $("cfgTxt").value=""; $("cfgTxt").focus(); $("cfgMsg").textContent="복사해 둔 설정 글을 붙여 넣고 '이 설정 적용'을 누르세요."; });
$("bApply").addEventListener("click",()=>{ let v; try{ v=JSON.parse($("cfgTxt").value.trim()); }catch(_){ $("cfgMsg").textContent="설정 글이 아니에요."; return; }
  for(const k in DEF) if(k in v && typeof v[k]===typeof DEF[k]) S[k]=v[k]; save(); syncUI(); if(E.ok) rebuild(); $("cfgMsg").textContent="적용했어요."; });
$("bReset").addEventListener("click",()=>{ S=Object.assign({},DEF); save(); syncUI(); if(E.ok) rebuild(); });

/* ── 계산 ──
   높이 지도 바다 ('가상 관' 방식): 바다를 바둑판 칸으로 나누고, 칸마다 물 높이만 가진다.
   이웃 칸과 수면 높이 차이만큼 물이 관을 타고 흐르고(흐름은 조금씩 쌓여 관성이 생긴다), 흐른 만큼 높이가 바뀐다.
   얕은 백사장으로 밀려 올라갔다 빠지는 것, 마른 모래가 젖는 것까지 저절로 된다.
   격자 칸 = cs(바깥 세상 칸). 거품은 물결을 따라 흘러가고, 물보라 알갱이는 따로 가볍게 날아간다 */
const Q=new URLSearchParams(location.search), OFF=Q.get("off")==="1";
const SPN=131072;   /* 물보라 알갱이 최대 수 */
const E={ok:false};
let NX=0, NZ=0, CS=1, cv=$("cv"), dev=null, ctx=null, fmt2=null, depth=null, offTex=null;
const B={}, PL={}; let BGs=[null,null], BGR=null, ping=0, simT=0, WPH=0, SLAP=0, waveOn=true, paused=false, lineBuf=null;

const SIMW=/* wgsl */`
struct P { n: vec4u, a: vec4f, b: vec4f, c: vec4f, d: vec4f };
/* n: 칸 수 x·z, 물보라 최대, 제비 / a: 칸 크기, 박자, 중력, 물결 남기기 / b: 물 깊이, 파도 쪽 수면, 스며들기, 거품 / c: 해변 시작, 경사, 굴곡, 물보라 / d: 카메라 자리, 가까움 기준 */
@group(0) @binding(0) var<uniform> U: P;
@group(0) @binding(1) var<storage, read_write> W0: array<vec4f>;   /* 지난 박자: 물 높이, 흐름 x, 흐름 z, 거품 */
@group(0) @binding(2) var<storage, read_write> W1: array<vec4f>;   /* 이번 박자 */

/* 바다 옆면: 네 가장자리를 바닥 아래부터 수면(마른 곳은 모래면)까지 막아, 잘라 낸 바다 단면처럼 보이게 */
struct KO { @builtin(position) p: vec4f, @location(0) w: vec3f, @location(1) t: f32, @location(2) wet: f32 };

/* 물보라: 작은 공. 막 튀어 나온 것은 하얗게 */

struct LV { @builtin(position) p: vec4f, @location(0) c: vec3f };

const NSLOT=64, params=new ArrayBuffer(256*NSLOT); let pU=null, pF=null;

/* 바다 크기·세밀함이 바뀌면 칸을 새로 만들고 물을 채운다 */
function rebuild(){ NX=Math.max(16,Math.round(S.res)); CS=S.len/NX; NZ=Math.max(8,Math.round(S.wid/CS)); const n=NX*NZ, SB=GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST|GPUBufferUsage.COPY_SRC;

const bxW=()=>S.len*S.bstart;
const terrJS=(x,z)=>Math.max(0,(x-(bxW()+S.curve*(7*Math.sin(z*0.045)+3.5*Math.sin(z*0.113+1.3))))*S.slope);
function fill(){ const n=NX*NZ, W=new Float32Array(n*4), Wt=new Float32Array(n);

/* 파도 쪽 수면: 빨리 솟고 천천히 내려가는 모양 */
function waveTarget(dt){ WPH+=dt/S.per; SLAP*=Math.exp(-dt*0.8); const ph=WPH%1, p=0.5-0.35*S.skew, w=ph<p?0.5*ph/p:0.5+0.5*(ph-p)/(1-p), f=0.5-0.5*Math.cos(w*Math.PI*2);

const EYEG=[0,0,0,1];
let frameNo=0;
function simulate(fdt){

    pU[0]=NX; pU[1]=NZ; pU[2]=SPN; pU[3]=(frameNo*64+k)>>>0;
    pF[4]=CS; pF[5]=dt; pF[6]=S.grav; pF[7]=Math.pow(S.damp,dt*60);
    pF[8]=S.depth; pF[9]=waveTarget(dt); pF[10]=S.soak*0.6; pF[11]=S.foam*1.2;

    c.setPipeline(PL.spray); c.dispatchWorkgroups(Math.ceil(Math.min(SPN,spDraw+16384)/64)); c.end();   /* 만든 만큼만 움직인다 */

/* ── 카메라 ── */
const m4={ persp(f,a,n,fa){ const t=1/Math.tan(f/2); return [t/a,0,0,0, 0,t,0,0, 0,0,fa/(n-fa),-1, 0,0,n*fa/(n-fa),0]; },
  look(e,c,u){ const z=nrm(sub(e,c)), x=nrm(crs(u,z)), y=crs(z,x); return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,e),-dot(y,e),-dot(z,e),1]; } };

let last=performance.now(), lastDraw=0, fT=0, fN=0, stepsN=0, spDraw=0, spAsk=false, spBusy=false;
let inflight=0;
function frame(now){

  if(now-lastDraw<15.5){ requestAnimationFrame(frame); return; } lastDraw=now;   /* 1초에 60번까지만 그린다 */

  if(!paused) stepsN+=simulate(dt);

/* ── 손잡이 ── */
const stage=$("stage"), ORB={pts:new Map(),x:0,y:0,d0:0};
