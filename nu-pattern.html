<!doctype html>
<html lang="ko"><head>
<script src="nl-sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NU PATTERN</title>
<!-- v4: 그림 한 점에서 배운 레시피(바탕색·액체 색 층·결·굵기·방울·별)로, 뉴 플로우 액체 방식(농도 장 → 등고선)의 흐르는 장면을 만든다. v3 은 nu-pattern-v3.html -->
<style>
  :root{--bg:#f5f5f7;--panel:#fff;--panel-alt:#f5f5f7;--border:#d2d2d7;--border-soft:#e5e5ea;--ink:#1d1d1f;--ink-dim:#6e6e73;--accent:#1d1d1f;
    --font-sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  body{padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:1380px;margin:0 auto}
  header{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:2px;font-weight:600}
  .sub{font-size:12px;color:var(--ink-dim)}
  header a{font-size:12px;color:var(--ink-dim);margin-left:auto}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
  @media (max-width:960px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;min-width:0}
  .panel h3{font-size:11px;letter-spacing:1.4px;margin:0 0 10px;color:var(--ink-dim);font-weight:600;display:flex;align-items:center;gap:8px}
  .panel h3 button{margin-left:auto}
  .stage{background:#fff;border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;display:flex;justify-content:center}
  #cv{display:block;max-width:100%;max-height:78vh;width:auto;height:auto}
  .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button{font-family:inherit;font-size:11.5px;letter-spacing:.4px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{background:var(--panel-alt)}button.on,button.go{background:var(--accent);color:#fff;border-color:var(--accent)}button.go{font-weight:600}button.sm{padding:4px 8px;font-size:11px}
  .sl{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:9px;margin:7px 0}
  .sl label{font-size:11.5px;color:var(--ink-dim)}.sl output{font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);margin:4px 12px 4px 0}
  select{font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
  .stat{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .tagbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px;max-height:300px;overflow:auto;padding:2px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;display:block}
  .grid img.sel{border-color:var(--ink)}
  .cur{display:flex;gap:10px;align-items:center;margin-top:10px}
  .cur img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border-soft)}
  .cur .nm{font-size:12px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
  .chips{display:flex;gap:3px;margin-top:4px}.chips i{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-soft);display:block}
</style></head>
<body><div class="wrap">
<header><h1>NU PATTERN</h1><span class="sub">그림에서 배운 배경 레시피로, 매번 다르게 흐르는 패턴</span><a href="nu-pattern-v3.html">이전 버전(v3)</a></header>
<div class="cols">
  <div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="row">
      <button class="go" id="bPlay">일시정지</button>
      <button id="bSeed">새로 그리기</button>
      <button id="bAny">아무 그림</button>
      <select id="aspect"><option value="1.25">4 : 5</option><option value="1">1 : 1</option><option value="0.5625">16 : 9</option><option value="1.7778">9 : 16</option></select>
      <span class="stat" id="stat"></span>
    </div>
    <div class="row">
      <button id="bPng">PNG 저장</button>
      <button id="bSvg">SVG 저장</button>
      <button id="bRec">영상 녹화 (WebM)</button>
      <select id="recSec"><option value="5">5초</option><option value="10">10초</option><option value="20">20초</option></select>
      <select id="outW"><option value="1200">저장 1200px</option><option value="2400">저장 2400px</option><option value="4000">저장 4000px</option></select>
    </div>
  </div>
  <div>
    <div class="panel">
      <h3>어느 그림의 배경으로 <span class="stat" id="nRec"></span></h3>
      <div class="tagbar" id="tags"></div>
      <div class="grid" id="grid"></div>
      <div class="cur" id="cur"></div>
    </div>
    <div class="panel">
      <h3>모양 <button class="sm" id="rShape">모양 초기화</button></h3>
      <div id="sShape"></div>
      <label class="chk"><input type="checkbox" id="cShade">그늘</label>
      <label class="chk"><input type="checkbox" id="cGloss">하이라이트</label>
    </div>
    <div class="panel">
      <h3>움직임 <button class="sm" id="rMove">움직임 초기화</button></h3>
      <div id="sMove"></div>
    </div>
    <div class="panel">
      <h3>저장된 설정 <button class="sm" id="rAll">모두 초기화</button></h3>
      <div class="stat">설정은 이 브라우저에 자동 저장됩니다. 고른 그림·화면비·슬라이더가 다음에도 그대로 열립니다.</div>
    </div>
  </div>
</div></div>
<script src="nu-objects.js"></script><script src="nu-liquid.js"></script><script src="nu-flowscene.js"></script><script src="nupattern-recipes.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), LS = 'nuPattern.v4';
// [키, 이름, 최소, 최대, 간격, 기본값, 다시 만들어야 하나]
const SHAPE = [['density', '양', 0.3, 2.5, 0.05, 1, 1], ['thick', '굵기', 0.4, 2.2, 0.05, 1, 1], ['lumps', '울퉁불퉁', 0, 2, 0.05, 1, 0], ['breakup', '끝 흩어짐', 0, 2, 0.05, 1, 0], ['deco', '별 장식', 0, 3, 0.05, 1, 0], ['lineW', '테두리', 0, 8, 0.1, 2.6, 0], ['light', '빛 방향(도)', -180, 180, 5, -135, 0]];
const MOVE = [['speed', '속도', 0, 4, 0.05, 1, 0], ['res', '화면 해상도', 400, 1200, 50, 720, 0]];
const DEF = { recipe: null, tag: 'all', seed: 3, aspect: 1.25, shade: true, gloss: true, recSec: 5, outW: 1200 };
for (const s of SHAPE.concat(MOVE)) DEF[s[0]] = s[5];
let P = Object.assign({}, DEF);
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) Object.assign(P, s); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} };
const RECS = window.NP_RECIPES || [];
if (!RECS.find(r => r.id === P.recipe)) P.recipe = RECS[Math.floor(Math.random() * RECS.length)].id;
const TAGN = { all: '전체', sopum: '패턴 소품', bgfull: '배경 전체', torso7: '토르소 7', torso9: '토르소 9', torso10: '토르소 10', painting: '그림' };
const cv = $('#cv'), ctx = cv.getContext('2d');
let S = null, playing = true;
const rec = () => RECS.find(r => r.id === P.recipe);
function regen() { S = NUFS.create(rec(), P.seed, { aspect: +P.aspect, density: P.density, thick: P.thick, deco: P.deco, lumps: P.lumps, breakup: P.breakup });
  for (let i = 0; i < 160; i++) NUFS.step(S, 0.05);   // 처음부터 흐르는 중인 모습으로
  sizeCanvas(); draw(); }
function live() { if (!S) return; S.o.lumps = P.lumps; S.o.breakup = P.breakup; S.o.deco = P.deco; }
function sizeCanvas() { const W = +P.res; cv.width = W; cv.height = Math.round(W * P.aspect); }
const ropt = () => ({ lineW: P.lineW, light: P.light, shade: P.shade ? undefined : false, gloss: P.gloss ? undefined : false });
function draw() { NUFS.render(ctx, S, cv.width, ropt()); }
// 슬라이더
function sliders(host, list) { host.innerHTML = ''; for (const [k, nm, a, b, st, , re] of list) { const d = document.createElement('div'); d.className = 'sl';
    d.innerHTML = `<label>${nm}</label><input type="range" min="${a}" max="${b}" step="${st}" data-k="${k}"><output></output>`; host.appendChild(d);
    const inp = d.querySelector('input'), out = d.querySelector('output'); inp.value = P[k]; out.textContent = (+P[k]).toFixed(st < 1 ? 2 : 0);
    inp.oninput = () => { P[k] = +inp.value; out.textContent = (+P[k]).toFixed(st < 1 ? 2 : 0); save(); if (re) regen(); else if (k === 'res') { sizeCanvas(); draw(); } else { live(); if (!playing) draw(); } }; } }
function syncUI() { sliders($('#sShape'), SHAPE); sliders($('#sMove'), MOVE); $('#cShade').checked = P.shade; $('#cGloss').checked = P.gloss; $('#aspect').value = String(P.aspect); $('#recSec').value = String(P.recSec); $('#outW').value = String(P.outW); tags(); grid(); }
// 그림 고르기
function tags() { const T = ['all'].concat([...new Set(RECS.map(r => r.tag))]); $('#tags').innerHTML = '';
  for (const t of T) { const b = document.createElement('button'); b.className = 'sm' + (P.tag === t ? ' on' : ''); b.textContent = (TAGN[t] || t) + ' ' + (t === 'all' ? RECS.length : RECS.filter(r => r.tag === t).length); b.onclick = () => { P.tag = t; save(); tags(); grid(); }; $('#tags').appendChild(b); } }
function grid() { const g = $('#grid'); g.innerHTML = ''; for (const r of RECS) { if (P.tag !== 'all' && r.tag !== P.tag) continue; const im = new Image(); im.src = 'data:image/jpeg;base64,' + r.t; im.title = r.name; im.dataset.id = r.id; im.loading = 'lazy'; if (r.id === P.recipe) im.className = 'sel';
    im.onclick = () => pick(r.id); g.appendChild(im); } cur(); }
function cur() { const r = rec(); $('#cur').innerHTML = `<img src="data:image/jpeg;base64,${r.t}" alt=""><div class="nm">${r.name}<br><span class="stat">바탕 ${r.ground} · 액체 ${r.L.length}가지</span><div class="chips"><i style="background:${r.ground}"></i>${r.L.map(l => `<i style="background:${l.c}"></i>`).join('')}${(r.stars || []).map(c => `<i style="background:${c}"></i>`).join('')}</div></div>`; $('#nRec').textContent = RECS.length + '점에서 배움'; }
function pick(id) { P.recipe = id; save(); document.querySelectorAll('#grid img').forEach(im => im.classList.toggle('sel', im.dataset.id === id)); cur(); regen(); }
$('#bAny').onclick = () => { const pool = RECS.filter(r => P.tag === 'all' || r.tag === P.tag); P.seed = Math.floor(Math.random() * 1e6); pick(pool[Math.floor(Math.random() * pool.length)].id); };
$('#bSeed').onclick = () => { P.seed = Math.floor(Math.random() * 1e6); save(); regen(); };
$('#bPlay').onclick = () => { playing = !playing; $('#bPlay').textContent = playing ? '일시정지' : '재생'; $('#bPlay').classList.toggle('go', playing); };
$('#aspect').onchange = e => { P.aspect = +e.target.value; save(); regen(); };
$('#recSec').onchange = e => { P.recSec = +e.target.value; save(); };
$('#outW').onchange = e => { P.outW = +e.target.value; save(); };
$('#cShade').onchange = e => { P.shade = e.target.checked; save(); if (!playing) draw(); };
$('#cGloss').onchange = e => { P.gloss = e.target.checked; save(); if (!playing) draw(); };
function resetList(list) { for (const s of list) P[s[0]] = s[5]; }
$('#rShape').onclick = () => { resetList(SHAPE); P.shade = true; P.gloss = true; save(); syncUI(); regen(); };
$('#rMove').onclick = () => { resetList(MOVE); save(); syncUI(); sizeCanvas(); draw(); };
$('#rAll').onclick = () => { try { localStorage.removeItem(LS); } catch (e) {} const r = P.recipe; P = Object.assign({}, DEF, { recipe: r }); syncUI(); regen(); };
// 저장
const fname = ext => `nu-pattern_${P.recipe}_${P.seed}_${Math.round(S.t * 10)}.${ext}`;
function dl(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
$('#bPng').onclick = () => { const c = document.createElement('canvas'), W = +P.outW; c.width = W; c.height = Math.round(W * P.aspect); NUFS.render(c.getContext('2d'), S, W, ropt()); c.toBlob(b => { const u = URL.createObjectURL(b); dl(u, fname('png')); setTimeout(() => URL.revokeObjectURL(u), 4000); }); };
function svgText() { const W = +P.outW, H = Math.round(W * P.aspect), R = NUO.svgRecorder(W, H); R.fillRect = (x, y, w, h) => { R.beginPath(); R.rect(x, y, w, h); R.fill(); }; NUFS.render(R, S, W, ropt()); return R.toSVG(); }
$('#bSvg').onclick = () => { const u = URL.createObjectURL(new Blob([svgText()], { type: 'image/svg+xml' })); dl(u, fname('svg')); setTimeout(() => URL.revokeObjectURL(u), 4000); };
let recording = null;
$('#bRec').onclick = () => { if (recording) { recording.stop(); return; } if (!cv.captureStream || !window.MediaRecorder) { $('#stat').textContent = '이 브라우저는 녹화를 지원하지 않아요'; return; }
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)); const mr = new MediaRecorder(cv.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8e6 }), chunks = [];
  mr.ondataavailable = e => e.data.size && chunks.push(e.data); mr.onstop = () => { recording = null; $('#bRec').textContent = '영상 녹화 (WebM)'; $('#bRec').classList.remove('on'); const u = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); dl(u, fname('webm')); setTimeout(() => URL.revokeObjectURL(u), 8000); };
  if (!playing) $('#bPlay').click(); mr.start(); recording = mr; $('#bRec').textContent = '녹화 중… 멈춤'; $('#bRec').classList.add('on'); setTimeout(() => recording === mr && mr.stop(), P.recSec * 1000); };
// 돌리기
let last = performance.now(), fN = 0, fT = 0, rT = 0;
function loop(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && S) { NUFS.step(S, dt * P.speed); const t0 = performance.now(); draw(); rT += performance.now() - t0; fN++; fT += dt;
    if (fT > 1) { $('#stat').textContent = `${Math.round(fN / fT)} fps · 그리기 ${(rT / fN).toFixed(0)}ms`; fN = 0; fT = 0; rT = 0; } }
  requestAnimationFrame(loop); }
window.NP4 = { svgText, get S() { return S; }, P: () => P };
syncUI(); regen(); requestAnimationFrame(loop);
</script>
</body></html>
